  createHookTexture() {
    const size = 14;
    const g = this.add.graphics();

    // Shaft plus a curled tip — a simple metal J-hook silhouette.
    g.lineStyle(2, 0x999999, 1);
    g.beginPath();
    g.moveTo(size / 2, 0);
    g.lineTo(size / 2, size - 6);
    g.arc(size / 2 - 3, size - 6, 3, 0, Math.PI * 1.4, false);
    g.strokePath();

    g.generateTexture('hookTexture', size, size);
    g.destroy();
  }

  createUpgradeIconTextures() {
    const s = UPGRADE_ICON_SIZE;

    // Repair — a plus/cross, in the same green the health bar uses when
    // healthy. Drawn as one closed polygon rather than two overlapping
    // rects so there's no visible seam where they'd cross.
    {
      const g = this.add.graphics();
      const t = s * 0.32; // arm thickness
      const lo = s / 2 - t / 2, hi = s / 2 + t / 2;
      g.fillStyle(0x4caf50, 1);
      g.beginPath();
      g.moveTo(lo, 0);
      g.lineTo(hi, 0);
      g.lineTo(hi, lo);
      g.lineTo(s, lo);
      g.lineTo(s, hi);
      g.lineTo(hi, hi);
      g.lineTo(hi, s);
      g.lineTo(lo, s);
      g.lineTo(lo, hi);
      g.lineTo(0, hi);
      g.lineTo(0, lo);
      g.lineTo(lo, lo);
      g.closePath();
      g.fillPath();
      g.generateTexture('iconRepairTexture', s, s);
      g.destroy();
    }

    // Boat speed — a bold forward chevron with a couple of motion
    // lines trailing it, like a wake.
    {
      const g = this.add.graphics();
      g.fillStyle(0xffffff, 1);
      g.fillTriangle(s * 0.35, s * 0.15, s * 0.35, s * 0.85, s * 0.78, s * 0.5);
      g.lineStyle(3, 0xffffff, 0.6);
      g.lineBetween(s * 0.04, s * 0.32, s * 0.24, s * 0.32);
      g.lineBetween(s * 0.04, s * 0.68, s * 0.24, s * 0.68);
      g.generateTexture('iconSpeedTexture', s, s);
      g.destroy();
    }

    // Hook range — a target/rings icon.
    {
      const g = this.add.graphics();
      g.lineStyle(2, 0xffffff, 1);
      g.strokeCircle(s / 2, s / 2, s * 0.42);
      g.strokeCircle(s / 2, s / 2, s * 0.24);
      g.fillStyle(0xffffff, 1);
      g.fillCircle(s / 2, s / 2, s * 0.07);
      g.generateTexture('iconRangeTexture', s, s);
      g.destroy();
    }

    // Hook speed — a lightning bolt.
    {
      const g = this.add.graphics();
      g.fillStyle(0xffe066, 1);
      g.beginPath();
      g.moveTo(s * 0.55, 0);
      g.lineTo(s * 0.15, s * 0.55);
      g.lineTo(s * 0.42, s * 0.55);
      g.lineTo(s * 0.35, s);
      g.lineTo(s * 0.85, s * 0.4);
      g.lineTo(s * 0.55, s * 0.4);
      g.closePath();
      g.fillPath();
      g.generateTexture('iconHookSpeedTexture', s, s);
      g.destroy();
    }
  }

  createRockTexture() {
    const size = ROCK_RADIUS * 2;
    const cx = ROCK_RADIUS;
    const cy = ROCK_RADIUS;
    const g = this.add.graphics();

    // Slightly irregular rock silhouette (a wobbled circle)
    g.fillStyle(0x8a8a8a, 1);
    g.lineStyle(2, 0x5f5f5f, 1);
    g.beginPath();
    const points = 10;
    for (let i = 0; i <= points; i++) {
      const angle = (i / points) * Math.PI * 2;
      const wobble = 1 + (i % 2 === 0 ? 0.08 : -0.06);
      const px = cx + Math.cos(angle) * ROCK_RADIUS * wobble;
      const py = cy + Math.sin(angle) * ROCK_RADIUS * wobble;
      if (i === 0) g.moveTo(px, py);
      else g.lineTo(px, py);
    }
    g.closePath();
    g.fillPath();
    g.strokePath();

    // A couple of darker shading patches for a bit of depth
    g.fillStyle(0x6f6f6f, 0.6);
    g.fillEllipse(cx - 5, cy + 4, 14, 9);
    g.fillStyle(0xa8a8a8, 0.6);
    g.fillEllipse(cx + 4, cy - 6, 10, 7);

    g.generateTexture('rockTexture', size, size);
    g.destroy();
  }

  // Drawn lying flat (long edge horizontal) — the vertical-moving
  // driftwood piece rotates the sprite 90° at creation instead of this
  // being drawn twice, see the DRIFTWOOD_CONFIGS loop in create().
  createDriftwoodTexture() {
    const w = DRIFTWOOD_LEN;
    const h = DRIFTWOOD_WIDTH;
    const g = this.add.graphics();

    g.fillStyle(0x6b4423, 1);
    g.lineStyle(1, 0x4a2e18, 1);
    g.fillRoundedRect(0, 0, w, h, h / 2); // capsule shape reads as a log's rounded tips
    g.strokeRoundedRect(0, 0, w, h, h / 2);

    // Rings near each end suggest cut log faces; a couple of grain
    // lines along the length for texture.
    g.lineStyle(1.5, 0x4a2e18, 0.7);
    g.strokeEllipse(h * 0.55, h / 2, h * 0.55, h * 0.85);
    g.strokeEllipse(w - h * 0.55, h / 2, h * 0.55, h * 0.85);
    g.lineStyle(1, 0x53311d, 0.5);
    g.lineBetween(h * 0.9, h * 0.3, w - h * 0.9, h * 0.3);
    g.lineBetween(h * 0.9, h * 0.7, w - h * 0.9, h * 0.7);

    g.generateTexture('driftwoodTexture', w, h);
    g.destroy();
  }
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  backgroundColor: '#3a7bd5',
  width: WIDTH,
  height: HEIGHT,
  input: {
    activePointers: 3 // joystick + hook button need to work as simultaneous touches
  },
  physics: {
    default: 'matter',
    matter: {
      gravity: { x: 0, y: 0 },
      debug: false
    }
  },
  scene: [TitleScene, MainScene]
};

new Phaser.Game(config);
</script>
