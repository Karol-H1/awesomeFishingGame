<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lake Canoe</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
  }
  #game-container {
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
  }
  #hint {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #cde;
    font-size: 13px;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div id="game-container"></div>
<div id="hint">WASD to paddle around the lake &nbsp;|&nbsp; H to toggle hitbox view</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
<script>
const WIDTH = 800;
const HEIGHT = 600;
const BORDER = 50;  // distance from screen edge to the water — includes grass + beach
const BEACH = 18;   // thickness of the sand band, the inner part of BORDER, next to the water
const BOAT_SPEED = 200;

// Canoe texture dimensions and the hitbox carved out of it.
// The hitbox is trimmed slightly from the sharp bow/stern tips for a
// hitbox that feels fair rather than exactly tracing the hull outline.
const CANOE_TEX_W = 76;
const CANOE_TEX_H = 34;
const HITBOX_W = 54;
const HITBOX_H = 18;
const HITBOX_OFFSET_X = 6;
const HITBOX_OFFSET_Y = (CANOE_TEX_H - HITBOX_H) / 2;

// Health bar
const MAX_HEALTH = 100;
const DAMAGE_PERCENT = 5;      // health lost per rock collision
const HIT_COOLDOWN_MS = 800;   // brief invulnerability after a hit, so one
                                // bump against a rock doesn't melt health
                                // every physics step while still touching it
const HEALTH_BAR_WIDTH = HITBOX_W; // never exceeds the boat's own length
const HEALTH_BAR_HEIGHT = 6;
const HEALTH_BAR_OFFSET_Y = 24; // how far below the boat it floats

// Rock
const ROCK_RADIUS = 20;

class MainScene extends Phaser.Scene {
  constructor() {
    super('MainScene');
  }

  preload() {
    // No external image assets for the MVP — we draw everything
    // procedurally with Phaser Graphics and bake it into textures.
    this.createLakeTexture();
    this.createCanoeTexture();
    this.createRockTexture();
  }

  create() {
    this.add.image(0, 0, 'lakeBackground').setOrigin(0, 0);

    // Spawn away from dead-center, since the rock sits in the middle
    // of the lake and we don't want the boat starting on top of it.
    this.boat = this.physics.add.sprite(BORDER + 90, HEIGHT - BORDER - 90, 'canoeTexture');
    this.boat.setCollideWorldBounds(true);
    this.boat.health = MAX_HEALTH;
    this.boat.lastHitTime = 0;

    // Give the boat a hitbox smaller than its full texture, matching
    // just the hull silhouette. Arcade Physics bodies are axis-aligned
    // and do NOT rotate with the sprite — worth knowing once we add
    // more obstacles, since a long thin hull will "feel" wider when
    // facing diagonally than the art suggests.
    this.boat.body.setSize(HITBOX_W, HITBOX_H);
    this.boat.body.setOffset(HITBOX_OFFSET_X, HITBOX_OFFSET_Y);

    // Constrain movement to the water area, not the full canvas,
    // so the boat can never drive onto the land border.
    this.physics.world.setBounds(BORDER, BORDER, WIDTH - BORDER * 2, HEIGHT - BORDER * 2);

    // A rock sitting in the middle of the lake. It's static — it
    // never moves — but still needs a physics body to collide with.
    this.rock = this.physics.add.staticImage(WIDTH / 2, HEIGHT / 2, 'rockTexture');
    this.rock.body.setCircle(ROCK_RADIUS);
    this.physics.add.collider(this.boat, this.rock, this.hitRock, null, this);

    this.keys = this.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.W,
      down: Phaser.Input.Keyboard.KeyCodes.S,
      left: Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D
    });

    // Debug view of the boat's hitbox — press H to toggle.
    this.hitboxGraphics = this.add.graphics();
    this.showHitbox = false;
    this.input.keyboard.on('keydown-H', () => {
      this.showHitbox = !this.showHitbox;
      if (!this.showHitbox) this.hitboxGraphics.clear();
    });

    // Health bar — redrawn every frame in update() so it can track
    // the boat's position without being a child of the (rotating) sprite.
    this.healthBarGraphics = this.add.graphics();
  }

  hitRock(boat, rock) {
    const now = boat.scene.time.now;
    if (now < boat.lastHitTime + HIT_COOLDOWN_MS) return; // still on cooldown
    boat.lastHitTime = now;
    boat.health = Math.max(0, boat.health - DAMAGE_PERCENT);
  }

  update() {
    let vx = 0;
    let vy = 0;

    if (this.keys.left.isDown) vx -= 1;
    if (this.keys.right.isDown) vx += 1;
    if (this.keys.up.isDown) vy -= 1;
    if (this.keys.down.isDown) vy += 1;

    if (vx !== 0 || vy !== 0) {
      const len = Math.sqrt(vx * vx + vy * vy);
      vx = (vx / len) * BOAT_SPEED;
      vy = (vy / len) * BOAT_SPEED;
      this.boat.rotation = Math.atan2(vy, vx);
    }

    this.boat.setVelocity(vx, vy);

    if (this.showHitbox) {
      const b = this.boat.body;
      this.hitboxGraphics.clear();
      this.hitboxGraphics.lineStyle(2, 0xff3333, 1);
      this.hitboxGraphics.strokeRect(b.x, b.y, b.width, b.height);
    }

    this.drawHealthBar();
  }

  drawHealthBar() {
    const pct = this.boat.health / MAX_HEALTH;
    const barX = this.boat.x - HEALTH_BAR_WIDTH / 2;
    const barY = this.boat.y + HEALTH_BAR_OFFSET_Y;

    this.healthBarGraphics.clear();

    // Background track
    this.healthBarGraphics.fillStyle(0x2b2b2b, 0.7);
    this.healthBarGraphics.fillRect(barX, barY, HEALTH_BAR_WIDTH, HEALTH_BAR_HEIGHT);

    // Fill — green when healthy, shifting to red as health drops
    const fillColor = pct > 0.5 ? 0x4caf50 : (pct > 0.25 ? 0xf0ad4e : 0xd9534f);
    this.healthBarGraphics.fillStyle(fillColor, 1);
    this.healthBarGraphics.fillRect(barX, barY, HEALTH_BAR_WIDTH * pct, HEALTH_BAR_HEIGHT);

    // Border
    this.healthBarGraphics.lineStyle(1, 0x111111, 0.9);
    this.healthBarGraphics.strokeRect(barX, barY, HEALTH_BAR_WIDTH, HEALTH_BAR_HEIGHT);
  }

  createLakeTexture() {
    const g = this.add.graphics();
    // Grass zone is the outer ring, from the screen edge up to where
    // the sand begins. Sand fills the ring between grass and water.
    const grassZone = BORDER - BEACH;

    // Land base (grass)
    g.fillStyle(0x4a7c3c, 1);
    g.fillRect(0, 0, WIDTH, HEIGHT);

    // Subtle grass texture patches, only within the grass ring
    g.fillStyle(0x3f6b32, 1);
    for (let i = 0; i < 60; i++) {
      const x = Phaser.Math.Between(0, WIDTH);
      const y = Phaser.Math.Between(0, HEIGHT);
      if (x < grassZone || x > WIDTH - grassZone || y < grassZone || y > HEIGHT - grassZone) {
        g.fillCircle(x, y, Phaser.Math.Between(3, 9));
      }
    }

    // Little pine trees lining the grass, set back from the beach
    g.fillStyle(0x2d5024, 1);
    for (let x = 15; x < WIDTH; x += 28) {
      g.fillTriangle(x, grassZone - 10, x - 7, grassZone - 24, x + 7, grassZone - 24);
      g.fillTriangle(x, HEIGHT - grassZone + 10, x - 7, HEIGHT - grassZone + 24, x + 7, HEIGHT - grassZone + 24);
    }
    for (let y = 15; y < HEIGHT; y += 28) {
      g.fillTriangle(grassZone - 10, y, grassZone - 24, y - 7, grassZone - 24, y + 7);
      g.fillTriangle(WIDTH - grassZone + 10, y, WIDTH - grassZone + 24, y - 7, WIDTH - grassZone + 24, y + 7);
    }

    // Sand beach ring, between the grass and the water
    g.fillStyle(0xe0c284, 1);
    g.fillRect(grassZone, grassZone, WIDTH - grassZone * 2, HEIGHT - grassZone * 2);

    // A few darker sand speckles / pebbles for texture, confined to the beach ring
    g.fillStyle(0xc9a86a, 0.8);
    for (let i = 0; i < 90; i++) {
      const x = Phaser.Math.Between(grassZone, WIDTH - grassZone);
      const y = Phaser.Math.Between(grassZone, HEIGHT - grassZone);
      const inOuter = x >= grassZone && x <= WIDTH - grassZone && y >= grassZone && y <= HEIGHT - grassZone;
      const inInner = x >= BORDER && x <= WIDTH - BORDER && y >= BORDER && y <= HEIGHT - BORDER;
      if (inOuter && !inInner) {
        g.fillCircle(x, y, Phaser.Math.Between(1, 3));
      }
    }

    // Water
    g.fillStyle(0x3a7bd5, 1);
    g.fillRect(BORDER, BORDER, WIDTH - BORDER * 2, HEIGHT - BORDER * 2);

    // Gentle ripple lines on the water
    g.lineStyle(2, 0x5b9be0, 0.5);
    for (let y = BORDER + 20; y < HEIGHT - BORDER; y += 26) {
      g.beginPath();
      g.moveTo(BORDER + 10, y);
      for (let x = BORDER + 10; x < WIDTH - BORDER; x += 16) {
        g.lineTo(x, y + Math.sin(x * 0.05) * 4);
      }
      g.strokePath();
    }

    g.generateTexture('lakeBackground', WIDTH, HEIGHT);
    g.destroy();
  }

  createCanoeTexture() {
    // Convention: at rotation 0, the sprite faces along +x (screen
    // right). So the bow (front) is drawn on the right side of the
    // texture, the stern (back) on the left. This must stay in sync
    // with how boat.rotation is set from velocity in update().
    const w = CANOE_TEX_W;
    const h = CANOE_TEX_H;
    const g = this.add.graphics();

    // Hull — asymmetric on purpose: the bow (right) tapers to a
    // sharper point, the stern (left) is blunter. Combined with the
    // fisherman facing the bow below (see the nose nub), this makes
    // "front" readable even at a glance.
    g.fillStyle(0x8b5a2b, 1);
    g.lineStyle(2, 0x5c3a1a, 1);
    g.beginPath();
    g.moveTo(6, h / 2);            // stern tip (blunter curve into it)
    g.lineTo(16, h / 2 - 9);
    g.lineTo(50, h / 2 - 9);
    g.lineTo(64, h / 2);           // bow tip (sharper — closer, tighter taper)
    g.lineTo(50, h / 2 + 9);
    g.lineTo(16, h / 2 + 9);
    g.closePath();
    g.fillPath();
    g.strokePath();

    // Darker interior "box" the fisherman sits inside
    g.fillStyle(0x6b4423, 1);
    g.fillEllipse(w / 2 - 2, h / 2, 46, 14);

    // --- Fisherman, seated inside the hull, facing the bow (+x) ---
    const seatX = 30; // slightly toward the stern, so the bow has some open deck

    // Torso — kept within the hull's vertical extent (h/2 ± 9)
    g.fillStyle(0xc0392b, 1);
    g.fillRoundedRect(seatX - 6, h / 2 - 6, 12, 12, 3);

    // Head, offset toward the bow from the torso to read as "facing forward"
    g.fillStyle(0xe0ac69, 1);
    g.fillCircle(seatX + 7, h / 2, 4.5);

    // Small nose/brim nub on the forward edge of the head — an
    // unambiguous "this is the front of the face" marker
    g.fillStyle(0xcf9a5c, 1);
    g.fillTriangle(
      seatX + 10, h / 2 - 2,
      seatX + 10, h / 2 + 2,
      seatX + 13, h / 2
    );

    g.generateTexture('canoeTexture', w, h);
    g.destroy();
  }

  createRockTexture() {
    const size = ROCK_RADIUS * 2;
    const cx = ROCK_RADIUS;
    const cy = ROCK_RADIUS;
    const g = this.add.graphics();

    // Slightly irregular rock silhouette (a wobbled circle)
    g.fillStyle(0x8a8a8a, 1);
    g.lineStyle(2, 0x5f5f5f, 1);
    g.beginPath();
    const points = 10;
    for (let i = 0; i <= points; i++) {
      const angle = (i / points) * Math.PI * 2;
      const wobble = 1 + (i % 2 === 0 ? 0.08 : -0.06);
      const px = cx + Math.cos(angle) * ROCK_RADIUS * wobble;
      const py = cy + Math.sin(angle) * ROCK_RADIUS * wobble;
      if (i === 0) g.moveTo(px, py);
      else g.lineTo(px, py);
    }
    g.closePath();
    g.fillPath();
    g.strokePath();

    // A couple of darker shading patches for a bit of depth
    g.fillStyle(0x6f6f6f, 0.6);
    g.fillEllipse(cx - 5, cy + 4, 14, 9);
    g.fillStyle(0xa8a8a8, 0.6);
    g.fillEllipse(cx + 4, cy - 6, 10, 7);

    g.generateTexture('rockTexture', size, size);
    g.destroy();
  }
}

const config = {
  type: Phaser.AUTO,
  width: WIDTH,
  height: HEIGHT,
  parent: 'game-container',
  backgroundColor: '#3a7bd5',
  physics: {
    default: 'arcade',
    arcade: {
      gravity: { x: 0, y: 0 },
      debug: false
    }
  },
  scene: MainScene
};

new Phaser.Game(config);
</script>
</body>
</html>
