<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lake Canoe</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
  }
  #game-container {
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
  }
  #hint {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #cde;
    font-size: 13px;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div id="game-container"></div>
<div id="hint">WASD to paddle around the lake</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
<script>
const WIDTH = 800;
const HEIGHT = 600;
const BORDER = 50; // thickness of the land border around the lake
const BOAT_SPEED = 200;

class MainScene extends Phaser.Scene {
  constructor() {
    super('MainScene');
  }

  preload() {
    // No external image assets for the MVP — we draw everything
    // procedurally with Phaser Graphics and bake it into textures.
    this.createLakeTexture();
    this.createCanoeTexture();
  }

  create() {
    this.add.image(0, 0, 'lakeBackground').setOrigin(0, 0);

    this.boat = this.physics.add.sprite(WIDTH / 2, HEIGHT / 2, 'canoeTexture');
    this.boat.setCollideWorldBounds(true);

    // Constrain movement to the water area, not the full canvas,
    // so the boat can never drive onto the land border.
    this.physics.world.setBounds(BORDER, BORDER, WIDTH - BORDER * 2, HEIGHT - BORDER * 2);

    this.keys = this.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.W,
      down: Phaser.Input.Keyboard.KeyCodes.S,
      left: Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D
    });
  }

  update() {
    let vx = 0;
    let vy = 0;

    if (this.keys.left.isDown) vx -= 1;
    if (this.keys.right.isDown) vx += 1;
    if (this.keys.up.isDown) vy -= 1;
    if (this.keys.down.isDown) vy += 1;

    if (vx !== 0 || vy !== 0) {
      const len = Math.sqrt(vx * vx + vy * vy);
      vx = (vx / len) * BOAT_SPEED;
      vy = (vy / len) * BOAT_SPEED;
      this.boat.rotation = Math.atan2(vy, vx);
    }

    this.boat.setVelocity(vx, vy);
  }

  createLakeTexture() {
    const g = this.add.graphics();

    // Land base
    g.fillStyle(0x4a7c3c, 1);
    g.fillRect(0, 0, WIDTH, HEIGHT);

    // Subtle land texture patches, only along the border
    g.fillStyle(0x3f6b32, 1);
    for (let i = 0; i < 60; i++) {
      const x = Phaser.Math.Between(0, WIDTH);
      const y = Phaser.Math.Between(0, HEIGHT);
      if (x < BORDER || x > WIDTH - BORDER || y < BORDER || y > HEIGHT - BORDER) {
        g.fillCircle(x, y, Phaser.Math.Between(3, 9));
      }
    }

    // Little pine trees lining the shore
    g.fillStyle(0x2d5024, 1);
    for (let x = 15; x < WIDTH; x += 28) {
      g.fillTriangle(x, BORDER - 8, x - 7, BORDER - 22, x + 7, BORDER - 22);
      g.fillTriangle(x, HEIGHT - BORDER + 8, x - 7, HEIGHT - BORDER + 22, x + 7, HEIGHT - BORDER + 22);
    }
    for (let y = 15; y < HEIGHT; y += 28) {
      g.fillTriangle(BORDER - 8, y, BORDER - 22, y - 7, BORDER - 22, y + 7);
      g.fillTriangle(WIDTH - BORDER + 8, y, WIDTH - BORDER + 22, y - 7, WIDTH - BORDER + 22, y + 7);
    }

    // Water
    g.fillStyle(0x3a7bd5, 1);
    g.fillRect(BORDER, BORDER, WIDTH - BORDER * 2, HEIGHT - BORDER * 2);

    // Gentle ripple lines on the water
    g.lineStyle(2, 0x5b9be0, 0.5);
    for (let y = BORDER + 20; y < HEIGHT - BORDER; y += 26) {
      g.beginPath();
      g.moveTo(BORDER + 10, y);
      for (let x = BORDER + 10; x < WIDTH - BORDER; x += 16) {
        g.lineTo(x, y + Math.sin(x * 0.05) * 4);
      }
      g.strokePath();
    }

    g.generateTexture('lakeBackground', WIDTH, HEIGHT);
    g.destroy();
  }

  createCanoeTexture() {
    const w = 64;
    const h = 34;
    const g = this.add.graphics();

    // Hull, pointed at both ends
    g.fillStyle(0x8b5a2b, 1);
    g.lineStyle(2, 0x5c3a1a, 1);
    g.beginPath();
    g.moveTo(2, h / 2);
    g.lineTo(14, h / 2 - 8);
    g.lineTo(w - 14, h / 2 - 8);
    g.lineTo(w - 2, h / 2);
    g.lineTo(w - 14, h / 2 + 8);
    g.lineTo(14, h / 2 + 8);
    g.closePath();
    g.fillPath();
    g.strokePath();

    // Darker interior
    g.fillStyle(0x6b4423, 1);
    g.fillEllipse(w / 2, h / 2, w * 0.55, h * 0.4);

    // Fisherman torso
    g.fillStyle(0xc0392b, 1);
    g.fillRoundedRect(w / 2 - 6, h / 2 - 10, 12, 12, 3);

    // Fisherman head
    g.fillStyle(0xe0ac69, 1);
    g.fillCircle(w / 2, h / 2 - 12, 5);

    // Fishing rod
    g.lineStyle(2, 0x3d2b1f, 1);
    g.beginPath();
    g.moveTo(w / 2 + 4, h / 2 - 8);
    g.lineTo(w / 2 + 22, h / 2 - 20);
    g.strokePath();

    // Fishing line
    g.lineStyle(1, 0xdddddd, 0.8);
    g.beginPath();
    g.moveTo(w / 2 + 22, h / 2 - 20);
    g.lineTo(w / 2 + 20, h / 2 + 2);
    g.strokePath();

    g.generateTexture('canoeTexture', w, h);
    g.destroy();
  }
}

const config = {
  type: Phaser.AUTO,
  width: WIDTH,
  height: HEIGHT,
  parent: 'game-container',
  backgroundColor: '#3a7bd5',
  physics: {
    default: 'arcade',
    arcade: {
      gravity: { x: 0, y: 0 },
      debug: false
    }
  },
  scene: MainScene
};

new Phaser.Game(config);
</script>
</body>
</html>
