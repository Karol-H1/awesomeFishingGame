<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Awesome Fishing Game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1a1a;
    font-family: sans-serif;
    touch-action: none; /* no pinch-zoom/scroll/pull-to-refresh while playing */
  }
  #game-container {
    width: 100vw;
    height: 100vh;
  }
  #hint {
    display: none; /* revealed once MainScene starts, see MainScene.create() */
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    color: #cde;
    font-size: 13px;
    opacity: 0.7;
  }
  #rotate-prompt {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #1a1a1a;
    color: #eaf4ff;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 20px;
    padding: 30px;
    box-sizing: border-box;
  }
  #nickname-input {
    display: none; /* shown only on TitleScene, see TitleScene create()/startGame() */
    position: fixed;
    transform: translateX(-50%);
    text-align: center;
    font-family: sans-serif;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.6);
    background: rgba(26, 26, 26, 0.55);
    color: #ffffff;
    outline: none;
    box-sizing: border-box;
    padding: 0 10px;
  }
  #nickname-input::placeholder {
    color: rgba(255, 255, 255, 0.6);
  }
  /* Only touch-primary devices (no hover, coarse pointer) get blocked
     here — a narrow desktop browser window should never trigger this. */
  @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
    #rotate-prompt { display: flex; }
  }
</style>
</head>
<body>
<div id="game-container"></div>
<div id="hint">WASD to paddle around the lake &nbsp;|&nbsp; Click to cast the hook &nbsp;|&nbsp; H to toggle hitbox view &nbsp;|&nbsp; R to restart</div>
<div id="rotate-prompt">Please rotate your device to landscape to play.</div>
<input id="nickname-input" type="text" placeholder="Nickname (optional)" maxlength="16" autocomplete="off" spellcheck="false">

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// Touch-primary devices get a virtual joystick + hook button instead of
// WASD/click (see createTouchControls() in MainScene). Detected once,
// at script load — matches the convention used for WIDTH/HEIGHT below.
const IS_TOUCH_DEVICE = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// WIDTH/HEIGHT below are captured once, at load. A touch device that
// loads this page in portrait (the #rotate-prompt overlay is covering
// everything in that case, see the <style> block) would otherwise lock
// in the wrong, portrait-shaped dimensions — so instead of trying to
// live-resize the running game, just reload once it's actually rotated
// to landscape, so this whole script re-runs with the right numbers.
if (IS_TOUCH_DEVICE && window.innerHeight > window.innerWidth) {
  window.addEventListener('resize', () => {
    if (window.innerHeight <= window.innerWidth) location.reload();
  });
}

// Sized to the actual browser window rather than a fixed 800x600, so the
// game genuinely fills the screen. This is now purely the *viewport* —
// what this player can see — not the lake's size; see WORLD_WIDTH/
// WORLD_HEIGHT below for that. HUD placement is still derived from
// WIDTH/HEIGHT, since the HUD is a fixed screen-space overlay.
const WIDTH = window.innerWidth;
const HEIGHT = window.innerHeight;

// Every fixed-pixel HUD size below (buttons, joystick, HUD text...) was
// originally tuned looking at a normal desktop browser window. A phone
// in landscape is much shorter, so without this, those same fixed sizes
// eat a far bigger fraction of the (smaller) screen. UI_SCALE brings
// every screen-space "size" constant down by the same fraction the
// height is short by, preserving the same proportions a desktop window
// already has. Capped at 1 so a normal (tall enough) desktop window is
// completely unaffected. This only applies to genuinely screen-space
// HUD now (buttons, joystick, text, nickname input, title screen) — see
// the note above WATER_LEFT below for why world content no longer uses it.
const UI_REFERENCE_HEIGHT = 800;
const UI_SCALE = Math.min(1, HEIGHT / UI_REFERENCE_HEIGHT);

// Tap targets that fingers actually have to hit repeatedly during play —
// joystick, hook button, restart button — read as "too small" well before
// plain UI_SCALE would call the layout crowded, since a fingertip doesn't
// shrink with the screen the way HUD art can. Floor the scale for these
// specifically, touch devices only; non-touch gets plain UI_SCALE (no
// floor), so desktop sizing is unaffected.
const TOUCH_UI_SCALE = IS_TOUCH_DEVICE ? Math.max(UI_SCALE, 0.85) : UI_SCALE;

// World — a single fixed lake size shared by every player, independent
// of anyone's own screen. Previously WIDTH/HEIGHT (this player's own
// window) doubled as the lake size too, so the whole lake was always
// fully visible at once; now the camera (see MainScene.create()) follows
// the boat around a world bigger than any one viewport, .io-game style,
// with a minimap (see drawMinimap()) filling in what's off-screen.
// WORLD_SIZE_MULTIPLIER is the single knob for "how much bigger than a
// typical old-style screen-sized lake" — safe to retune later.
const WORLD_REFERENCE_W = 1200, WORLD_REFERENCE_H = 800;
const WORLD_SIZE_MULTIPLIER = 3.5;
const WORLD_WIDTH = Math.round(WORLD_REFERENCE_W * WORLD_SIZE_MULTIPLIER);
const WORLD_HEIGHT = Math.round(WORLD_REFERENCE_H * WORLD_SIZE_MULTIPLIER);

// Every world-space size from here down is a fixed constant, not scaled
// by UI_SCALE — the world, and everything in it (boat, rocks, hitboxes,
// hook range...), is the same size for every player regardless of their
// screen, unlike the old "the world IS the screen" model where shrinking
// things to fit a small screen made sense. WORLD_OBJECT_SCALE replaces
// the old per-viewer `.setScale(UI_SCALE)` on world sprites — always 1,
// named so it's easy to find every place that intentionally uses a fixed
// world scale instead of a screen-relative one.
const WORLD_OBJECT_SCALE = 1;
const BORDER = 60;  // land ring thickness — equal on all four sides now (no more HUD-reserved taller top, see step 3 below)
const BEACH = 20;   // thickness of the sand band, the inner part of the border, next to the water
const BOAT_SPEED = 100; // starting speed (up from 75, reported as a little slow) — "increase boat speed" is an upgrade, see UPGRADE_SPEED_INCREMENT

// Water rect derived from the (now-symmetric) border, reused for physics
// bounds, spawn positions, and the lake background.
const WATER_LEFT = BORDER;
const WATER_RIGHT = WORLD_WIDTH - BORDER;
const WATER_TOP = BORDER;
const WATER_BOTTOM = WORLD_HEIGHT - BORDER;

// Render depth — fish swim underneath the boat rather than on top of it.
const DEPTH_FISH = 1;
const DEPTH_BOAT = 2;
const DEPTH_TOUCH_UI = 10; // HUD sits above everything — every screen-space HUD element uses this or higher

// Canoe texture dimensions (the baked pixel art itself — left at full
// size, never scaled, so its hand-drawn proportions never distort; see
// this.boat.setScale(WORLD_OBJECT_SCALE) in create()) and the hitbox
// carved out of it. The hitbox is trimmed slightly from the sharp
// bow/stern tips for a hitbox that feels fair rather than exactly
// tracing the hull outline. With Matter physics, this rectangle is
// centered on the sprite and rotates together with it — no manual
// offset math needed.
const CANOE_TEX_W = 76;
const CANOE_TEX_H = 34;
const HITBOX_W = 54;
const HITBOX_H = 18;

// Health bar — drawn fresh each frame (not baked into a texture).
const MAX_HEALTH = 100;
const DAMAGE_PERCENT = 5;      // health lost per obstacle (rock or driftwood) collision
const HIT_COOLDOWN_MS = 800;   // brief invulnerability after a hit, so one
                                // bump against an obstacle doesn't melt health
                                // every physics step while still touching it
const HEALTH_BAR_WIDTH = HITBOX_W; // never exceeds the boat's own length
const HEALTH_BAR_HEIGHT = 6;
const HEALTH_BAR_OFFSET_Y = 24; // how far below the boat it floats

// Rocks — ROCK_RADIUS sizes the baked texture (left unscaled, same
// reasoning as the canoe); each rock's Matter body and on-screen size
// use the fixed WORLD_OBJECT_SCALE, see createRockTexture()'s caller
// in preload()/create().
const ROCK_RADIUS = 20;

// Scattered at fixed fractions of the world (see toLakeFraction() under
// Multiplayer) rather than fixed pixels or randomized per-client — the
// same trick already used to sync player/hook positions across players,
// applied here so every player sees rocks in the same relative spots
// without any network traffic at all (they never move, so there's
// nothing to keep in sync at runtime). More entries than the original
// screen-sized lake had, roughly matching the bigger world's area, and
// chosen to spread out while staying clear of the boat's spawn corner
// (bottom-left, see the spawnOffset boat placement below).
const ROCK_POSITIONS = [
  { nx: 0.50, ny: 0.50 },
  { nx: 0.20, ny: 0.18 },
  { nx: 0.40, ny: 0.12 },
  { nx: 0.62, ny: 0.20 },
  { nx: 0.82, ny: 0.14 },
  { nx: 0.90, ny: 0.45 },
  { nx: 0.72, ny: 0.60 },
  { nx: 0.55, ny: 0.80 },
  { nx: 0.35, ny: 0.85 },
  { nx: 0.15, ny: 0.65 },
  { nx: 0.10, ny: 0.40 },
  { nx: 0.30, ny: 0.45 }
];

// Driftwood — floats in a straight line across the world and wraps to
// the entering edge once it exits the opposite one. Its position is a
// pure function of wall-clock time (Date.now()), not physics or "time
// since this client's scene started" (which differs per player) — so
// every connected player computes the exact same fraction-of-the-world
// position at the same real moment and it's synced for free, the same
// zero-network-traffic trick as the static rocks above, just extended
// to something moving. `axis` is which world fraction sweeps 0→1 over
// that piece's crossing time (wrapping via modulo — reaching 1 is the
// same instant as re-entering at 0, i.e. "respawning on the opposite
// edge"); `cross` is the fixed fraction on the other axis; `phase`
// offsets the pieces so they don't move in lockstep. Crossing time is
// derived from DRIFTWOOD_SPEED (a fixed world px/sec) and the relevant
// world dimension, in updateDriftwood() — not a fixed duration — so
// driftwood moves at the same real speed regardless of how big the
// world is, rather than crossing a bigger world in the same time (and
// so moving faster) as a smaller one would have.
const DRIFTWOOD_SPEED = 50; // world px/sec
const DRIFTWOOD_CONFIGS = [
  { axis: 'x', cross: 0.30, phase: 0 },
  { axis: 'y', cross: 0.68, phase: 0.5 },
  { axis: 'x', cross: 0.55, phase: 0.35 },
  { axis: 'y', cross: 0.42, phase: 0.7 }
];
const DRIFTWOOD_LEN = 46;   // baked texture size, unscaled — see setScale(WORLD_OBJECT_SCALE) at creation
const DRIFTWOOD_WIDTH = 16;

// Hook
const HOOK_SPEED = 300;      // starting px/sec, both casting out and returning — "increase hook speed" is an upgrade
const HOOK_ARRIVE_DIST = 4;  // snap-to-target threshold, avoids jitter on the last frame
const HOOK_RANGE = 125;      // starting max cast distance — "increase hook range" is an upgrade, see UPGRADE_RANGE_INCREMENT
const HOOK_RANGE_COLOR = 0xffffff;
const HOOK_RANGE_ALPHA = 0.2;

// Range-triggered camera zoom: the range circle is drawn in world pixels
// (drawHookRange()), so on a world bigger than the viewport, a big enough
// range upgrade runs the circle off the edge of the screen — worst on
// mobile, where the viewport is smallest. Zooming the camera out just
// enough to keep the circle on screen fixes this without touching the
// circle itself. MIN_RANGE_ZOOM floors how far out we'll go, since Hook
// Range is a repeatable, uncapped upgrade — without a floor, a heavily
// upgraded player would zoom the whole game out to nothing.
const ZOOM_RANGE_MARGIN = 50;
const MIN_RANGE_ZOOM = 0.5;

// Upgrades — bought with caught fish, as a row of icon buttons along
// the top-right of the HUD. Defined as {cost, apply} pairs in
// createUpgradeButtons() so adding another later is a one-entry change.
const UPGRADE_REPAIR_COST = 3;
const UPGRADE_SPEED_COST = 5;
const UPGRADE_SPEED_INCREMENT = 15;
const UPGRADE_RANGE_COST = 5;
const UPGRADE_RANGE_INCREMENT = 25;
const UPGRADE_HOOK_SPEED_COST = 5;
const UPGRADE_HOOK_SPEED_INCREMENT = 50;
const UPGRADE_BUTTON_W = Math.round(84 * TOUCH_UI_SCALE);
const UPGRADE_BUTTON_H = Math.round(68 * TOUCH_UI_SCALE);
const UPGRADE_BUTTON_GAP = Math.round(8 * TOUCH_UI_SCALE);
const UPGRADE_ICON_SIZE = Math.round(28 * TOUCH_UI_SCALE); // icon texture is drawn fully proportional to this, safe to scale directly

// Screen-space height of the top HUD strip (fish count + upgrade shop),
// now that the HUD is a fixed overlay rather than baked into the top of
// the world's border. Used only to keep a click on the HUD from also
// casting the hook underneath it — see the pointerdown handler below.
const TOP_HUD_HEIGHT = Math.round(90 * UI_SCALE);

// Touch controls — only created on IS_TOUCH_DEVICE (see
// createTouchControls()). Joystick bottom-left replaces WASD; hook
// button bottom-right replaces click-to-aim, using the same
// nearest-thing-in-range auto-aim as the spacebar (see tryAutoAimCast()).
const JOYSTICK_MARGIN = Math.round(110 * TOUCH_UI_SCALE);      // distance from the bottom-left corner to the joystick's center
const JOYSTICK_BASE_RADIUS = Math.round(55 * TOUCH_UI_SCALE);
const JOYSTICK_STICK_RADIUS = Math.round(26 * TOUCH_UI_SCALE);
const JOYSTICK_DEADZONE = Math.round(12 * TOUCH_UI_SCALE);     // pixels of drag before movement kicks in, avoids jitter near center
const HOOK_BUTTON_MARGIN = Math.round(100 * TOUCH_UI_SCALE);   // distance from the bottom-right corner to the button's center
const HOOK_BUTTON_RADIUS = Math.round(48 * TOUCH_UI_SCALE);

// Fish
const LAKE_W = WATER_RIGHT - WATER_LEFT;
const LAKE_H = WATER_BOTTOM - WATER_TOP;
const FISH_MAX = 200; // up from 120 (which itself was up from 30 — see git history/TODO.md for that area-density fix);
// bumped further per direct request for noticeably more fish, well past the ~12.25x-area-matching baseline.
const FISH_SPAWN_INTERVAL_MS = 2500; // how often we try to top the pool back up to FISH_MAX
const FISH_CIRCLE_RADIUS = 30; // fixed world-space px, NOT derived from LAKE_W — a fish's own swim circle is a fixed
// per-entity trait (like WORLD_OBJECT_SCALE), not something that should balloon with the overall lake size. The old
// `LAKE_W / 32` grew ~3.5x along with the bigger world and made circles look far too large.
const FISH_ANGULAR_SPEED = Math.PI / 3; // radians/sec around their own circle — full loop in 6s, slowed from 4s
const FISH_CATCH_RADIUS = 16; // hook-to-fish distance that counts as a catch
const FISH_TEX_W = 20; // baked texture size, left unscaled — see spawnSwimmer()'s setScale(WORLD_OBJECT_SCALE)
const FISH_TEX_H = 10;
const FISH_SUBMERGED_TINT = 0x27425c;
const FISH_SUBMERGED_ALPHA = 0.55; // dark, translucent — reads as a shadow under the surface
const FISH_CAUGHT_TINT = 0xe8a33d;

// Sharks — swim identically to regular fish (same texture, same orbit
// behavior, so they're indistinguishable while submerged) but catching
// one is a trap: on catch it swaps to a large red shark sprite, and
// delivering it to the boat stuns and damages the boat instead of
// adding to the fish count. A separate, smaller population cap from
// regular fish.
const SHARK_MAX = 5; // up from 2, roughly matching the bigger world's area
const SHARK_SPAWN_INTERVAL_MS = 30000;
const SHARK_DAMAGE_PERCENT = 20;
const SHARK_STUN_MS = 1000;
const SHARK_STUN_TINT = 0xff6666;
const SHARK_TEX_W = 48; // baked texture size, left unscaled — see spawnSwimmer()'s setScale(WORLD_OBJECT_SCALE)
const SHARK_TEX_H = 24;
const SHARK_ATTACK_TEXT_OFFSET_Y = -28; // above the boat, mirroring the health bar below it

// Multiplayer — Firebase Realtime Database, chosen so there's no server
// to run ourselves: every client just reads/writes the same free-tier
// hosted database. Each player writes their own boat's state under
// /players/{id} and renders everyone else's from the same path. Fish
// and sharks stay local per-player; boats can now hook and steal from
// each other too (see Battling below).
const firebaseConfig = {
  apiKey: "AIzaSyD_NbpwH8rek02FSCGB4oo_j9-s8yO49w8",
  authDomain: "awesome-fishing-game.firebaseapp.com",
  databaseURL: "https://awesome-fishing-game-default-rtdb.firebaseio.com",
  projectId: "awesome-fishing-game",
  storageBucket: "awesome-fishing-game.firebasestorage.app",
  messagingSenderId: "802674699114",
  appId: "1:802674699114:web:71f39c921d10d9b6175313"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Persisted in localStorage so refreshing the page keeps controlling the
// same boat instead of spawning a new ghost every reload.
let playerId = localStorage.getItem('playerId');
if (!playerId) {
  playerId = 'p-' + Math.random().toString(36).slice(2, 10);
  localStorage.setItem('playerId', playerId);
}

const NETWORK_SYNC_INTERVAL_MS = 100; // ~10 updates/sec written to Firebase
const REMOTE_LABEL_OFFSET_Y = 20; // nickname (or "Player" if none set) label above a remote boat — world-space, matches the fixed boat size
// A nickname is information a player actually needs to read, not just
// decorative HUD chrome — so on touch it starts from a bigger base
// size (14 vs 10) before TOUCH_UI_SCALE's own 0.85 floor is applied,
// rather than just relying on that floor alone (which would still
// only land at ~9px on a short phone screen, not much of a fix for
// something reported as "too small to read"). Desktop is untouched:
// TOUCH_UI_SCALE equals plain UI_SCALE there, so this base is the only
// thing gating the size change to touch devices specifically.
const REMOTE_LABEL_FONT_BASE = IS_TOUCH_DEVICE ? 14 : 10;

// Battling — hooking another player's boat (rather than a fish) damages
// them and steals some of their catch. The attacker detects the hit
// locally (they already have the other boat's synced position) and
// drops a message in the victim's own "hits" inbox in Firebase; the
// victim is the one who actually applies the damage/fish loss to their
// own authoritative state and shows the "Ouch" callout, the same
// ownership model as everything else each player syncs about themself.
const PLAYER_HIT_DAMAGE_PERCENT = 10;
const PLAYER_HIT_FISH_STEAL_MAX = 2;
const BOAT_HIT_RADIUS = 26; // hook-to-opponent-boat distance that counts as a hit
const OUCH_TEXT_DURATION_MS = 900;
const OUCH_TEXT_OFFSET_Y = -34; // a bit higher than the shark-attack text so the two don't fully overlap

class TitleScene extends Phaser.Scene {
  constructor() {
    super('TitleScene');
  }

  create() {
    // The HTML hint bar describes gameplay controls that don't apply
    // yet — stay hidden until MainScene reveals it.
    document.getElementById('hint').style.display = 'none';

    const g = this.add.graphics();
    g.fillStyle(0x3a7bd5, 1);
    g.fillRect(0, 0, WIDTH, HEIGHT);
    g.lineStyle(2, 0x5b9be0, 0.5);
    for (let y = 20; y < HEIGHT; y += 30) {
      g.beginPath();
      g.moveTo(0, y);
      for (let x = 0; x < WIDTH; x += 16) {
        g.lineTo(x, y + Math.sin(x * 0.05) * 4);
      }
      g.strokePath();
    }

    // Title/subtitle font sizes scale down with UI_SCALE on a short
    // screen (previously fixed at 56px/18px always) — on a phone the
    // title alone, at full size, could eat over a sixth of the whole
    // screen height, crowding out everything below it. Created before
    // the layout math below so we can read their *real* rendered
    // .height (text metrics, not a guessed multiplier) rather than
    // estimating — repositioned once the full stack is computed.
    const titleFontSize = Math.max(24, Math.round(56 * UI_SCALE));
    const title = this.add.text(WIDTH / 2, 0, 'Awesome Fishing Game', {
      fontFamily: 'sans-serif',
      fontSize: titleFontSize + 'px',
      fontStyle: 'bold',
      color: '#ffffff',
      stroke: '#1a3a5c',
      strokeThickness: Math.max(3, Math.round(8 * UI_SCALE))
    }).setOrigin(0.5);

    const subtitleFontSize = Math.max(11, Math.round(18 * UI_SCALE));
    const subtitle = this.add.text(WIDTH / 2, 0, 'Cast your hook. Catch fish. Watch out for sharks.', {
      fontFamily: 'sans-serif',
      fontSize: subtitleFontSize + 'px',
      color: '#eaf4ff',
      stroke: '#000000',
      strokeThickness: Math.max(1, Math.round(3 * UI_SCALE))
    }).setOrigin(0.5);

    // The entire title screen — title, subtitle, nickname input, Play,
    // "press any key", Controls — is laid out as one sequential stack:
    // each block's position is the previous block's bottom edge plus a
    // gap, so blocks can never overlap each other by construction,
    // however short the screen is. Block *heights* stay as-is (title/
    // subtitle already shrunk above; nickname/Play/Controls stay
    // full-size, since shrinking those would undo their own legibility/
    // tappability fixes) — only the *gaps* between blocks shrink,
    // uniformly, if the full-size stack doesn't fit. This replaced a
    // fixed "HEIGHT * 0.32" anchor for the title and a fixed "+50"
    // offset for the subtitle that, together with an unshrinking title
    // font, could by themselves crowd out the interactive elements
    // below on a short phone screen — reported via a real-phone
    // screenshot after an earlier fix addressed overlapping instead.
    const nicknameH = Math.round(34 * TOUCH_UI_SCALE);
    const btnW = 180;
    const btnH = 60; // Play button — deliberately not touch-scaled, see GAME_DESIGN.md
    const controlsW = Math.round(150 * TOUCH_UI_SCALE);
    const controlsH = Math.round(40 * TOUCH_UI_SCALE);
    const bottomMargin = Math.round(16 * TOUCH_UI_SCALE);

    // topMargin's nominal value reproduces the exact old "title center
    // at HEIGHT * 0.32" position when everything fits (gapShrink below
    // is 1) — it only pulls the title higher, same as every other gap
    // here, once a short screen genuinely needs the room back.
    const topMargin = Math.max(10, HEIGHT * 0.32 - title.height / 2);
    const gapBelowTitle = Math.round(12 * UI_SCALE);
    const gapAboveNickname = Math.round(30 * TOUCH_UI_SCALE);
    const gapBelowNickname = Math.round(20 * TOUCH_UI_SCALE);
    const gapBelowPlay = Math.round(50 * TOUCH_UI_SCALE); // "press any key" sits inside this gap, see below
    const totalGaps = topMargin + gapBelowTitle + gapAboveNickname + gapBelowNickname + gapBelowPlay + bottomMargin;
    const totalBlocks = title.height + subtitle.height + nicknameH + btnH + controlsH;
    const available = HEIGHT - totalBlocks;
    // Never below 0.35 — beyond that things read as crushed together
    // rather than just cozy. On a screen too short even for that, the
    // stack extends past the bottom edge (Controls partially/fully
    // off-screen) rather than overlapping — the same "prefer clipping
    // over overlapping" trade-off an earlier Controls-button clamp
    // made, just now correctly accounting for everything, top to
    // bottom, instead of only part of the stack.
    const gapShrink = Math.max(0.35, Math.min(1, available / totalGaps));

    let cursorY = topMargin * gapShrink;
    title.setY(cursorY + title.height / 2);
    cursorY += title.height;
    cursorY += gapBelowTitle * gapShrink;
    subtitle.setY(cursorY + subtitle.height / 2);
    cursorY += subtitle.height;
    cursorY += gapAboveNickname * gapShrink;
    const nicknameY = cursorY + nicknameH / 2;
    cursorY += nicknameH;
    cursorY += gapBelowNickname * gapShrink;
    const btnY = cursorY;
    cursorY += btnH;
    const gapBelowPlayActual = gapBelowPlay * gapShrink;
    // 45% of the way through the Play→Controls gap — proportional
    // rather than a fixed offset, so it always lands strictly between
    // the two regardless of how much that gap has shrunk.
    const pressKeyY = btnY + btnH + gapBelowPlayActual * 0.45;
    cursorY += gapBelowPlayActual;
    const controlsY = cursorY;

    // A real HTML <input>, not a Phaser Text — Phaser has no built-in
    // editable/typable text widget, so a positioned DOM element is the
    // standard way to take text entry in a canvas game. Shown only here;
    // startGame() hides it again and reads its value.
    const nicknameInput = document.getElementById('nickname-input');
    nicknameInput.value = localStorage.getItem('nickname') || '';
    nicknameInput.style.display = 'block';
    nicknameInput.style.left = (WIDTH / 2) + 'px';
    nicknameInput.style.top = (nicknameY - nicknameH / 2) + 'px';
    nicknameInput.style.width = Math.min(240, WIDTH - 60) + 'px';
    nicknameInput.style.height = nicknameH + 'px';
    nicknameInput.style.fontSize = Math.round(15 * TOUCH_UI_SCALE) + 'px';
    // Enter submits, same as clicking Play — convenient once you've just
    // typed a name. The generic "any key starts the game" handler below
    // explicitly skips this element so normal typing doesn't trigger it.
    const nicknameEnterHandler = (e) => {
      if (e.key === 'Enter' && !this.controlsOpen) { e.preventDefault(); this.startGame(); }
    };
    nicknameInput.addEventListener('keydown', nicknameEnterHandler);
    this.events.once(Phaser.Scenes.Events.SHUTDOWN, () => {
      nicknameInput.removeEventListener('keydown', nicknameEnterHandler);
    });

    const btnX = WIDTH / 2 - btnW / 2;

    const btnGraphics = this.add.graphics();
    btnGraphics.fillStyle(0x1a1a1a, 0.6);
    btnGraphics.fillRoundedRect(btnX, btnY, btnW, btnH, 10);
    btnGraphics.lineStyle(2, 0xffffff, 0.8);
    btnGraphics.strokeRoundedRect(btnX, btnY, btnW, btnH, 10);

    const btnText = this.add.text(WIDTH / 2, btnY + btnH / 2, 'Play', {
      fontFamily: 'sans-serif',
      fontSize: '28px',
      fontStyle: 'bold',
      color: '#ffffff'
    }).setOrigin(0.5);

    // Gentle alpha pulse so the button reads as clickable. Tweening
    // alpha rather than scale avoids Graphics objects scaling from
    // their (0,0) origin instead of the button's visual center.
    this.tweens.add({
      targets: [btnGraphics, btnText],
      alpha: { from: 1, to: 0.6 },
      duration: 700,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut'
    });

    const zone = this.add.zone(WIDTH / 2, btnY + btnH / 2, btnW, btnH);
    zone.setInteractive({ useHandCursor: true });
    // Guarded so a click landing on the (much bigger) controls overlay
    // behind it can't also start the game — see showControlsPanel().
    zone.on('pointerdown', () => { if (!this.controlsOpen) this.startGame(); });

    this.add.text(WIDTH / 2, pressKeyY, 'or press any key', {
      fontFamily: 'sans-serif',
      fontSize: '13px',
      color: '#cfe3ff'
    }).setOrigin(0.5).setAlpha(0.75);

    // Not .once() — while the controls panel is open we want keydowns to
    // do nothing (see showControlsPanel()), and the panel might get
    // opened/closed more than once before the player actually starts.
    // Also skipped while the nickname input is focused — Phaser's
    // keyboard manager sees every keydown regardless of DOM focus, so
    // without this, typing a single letter of a nickname would
    // immediately start the game.
    this.input.keyboard.on('keydown', () => {
      if (!this.controlsOpen && document.activeElement !== nicknameInput) this.startGame();
    });

    this.controlsOpen = false;
    // controlsY was already computed above as part of the same
    // sequential stack Play and the nickname input belong to — passed
    // straight through rather than recomputed, so there's exactly one
    // place that decides vertical layout, not two disagreeing ones.
    this.createControlsButton(controlsY, controlsW, controlsH);
  }

  // A small button under the Play button, so players on both desktop
  // and mobile can check how to play before starting — the two have
  // completely different controls (see showControlsPanel()).
  createControlsButton(y, btnW, btnH) {
    const btnX = WIDTH / 2 - btnW / 2;

    const box = this.add.graphics();
    box.fillStyle(0x1a1a1a, 0.45);
    box.fillRoundedRect(btnX, y, btnW, btnH, 8);
    box.lineStyle(1, 0xffffff, 0.6);
    box.strokeRoundedRect(btnX, y, btnW, btnH, 8);

    this.add.text(WIDTH / 2, y + btnH / 2, 'Controls', {
      fontFamily: 'sans-serif',
      fontSize: '17px',
      color: '#ffffff'
    }).setOrigin(0.5);

    const zone = this.add.zone(WIDTH / 2, y + btnH / 2, btnW, btnH);
    zone.setInteractive({ useHandCursor: true });
    zone.on('pointerdown', () => this.showControlsPanel());
  }

  // A dismissable overlay listing the actual controls for this
  // device — different for touch (joystick/hook button) vs. mouse and
  // keyboard, since neither set of instructions is useful on the other.
  showControlsPanel() {
    if (this.controlsOpen) return;
    this.controlsOpen = true;

    // The nickname input is a real DOM element layered above the canvas
    // (see create()), so without this it would float on top of the dim
    // overlay below instead of being covered by it like everything else.
    const nicknameInput = document.getElementById('nickname-input');
    nicknameInput.style.visibility = 'hidden';

    const objects = [];
    const track = (obj) => { objects.push(obj); return obj; };

    // Covers the whole screen, both to dim the title behind the panel
    // and so tapping anywhere outside the panel closes it too — not
    // just the small Close button, which matters on a phone screen.
    const dim = track(this.add.graphics().setDepth(100));
    dim.fillStyle(0x000000, 0.75);
    dim.fillRect(0, 0, WIDTH, HEIGHT);
    const dimZone = track(this.add.zone(WIDTH / 2, HEIGHT / 2, WIDTH, HEIGHT).setDepth(100));
    dimZone.setInteractive();
    dimZone.on('pointerdown', () => close());

    const lines = IS_TOUCH_DEVICE ? [
      'Joystick (bottom-left) — steer the boat',
      'Hook button (bottom-right) — cast at the nearest fish, shark, or player',
      "Hooking another player's boat damages them and steals fish",
      'Buy upgrades with caught fish from the top bar',
      'Tap Restart after sinking to play again'
    ] : [
      'WASD — steer the boat',
      'Click — cast the hook toward the cursor',
      'Space — cast at the nearest fish, shark, or player automatically',
      "Hooking another player's boat damages them and steals fish",
      'Buy upgrades with caught fish from the top-right bar',
      'H — toggle hitbox debug view, R — restart'
    ];

    const panelW = Math.min(440, WIDTH - 60);
    const panelH = Math.min(70 + lines.length * 34 + 70, HEIGHT - 40);
    const panelX = WIDTH / 2 - panelW / 2;
    const panelY = HEIGHT / 2 - panelH / 2;

    const panel = track(this.add.graphics().setDepth(101));
    panel.fillStyle(0x11324d, 0.97);
    panel.fillRoundedRect(panelX, panelY, panelW, panelH, 14);
    panel.lineStyle(2, 0xffffff, 0.7);
    panel.strokeRoundedRect(panelX, panelY, panelW, panelH, 14);

    // Consumes clicks so tapping inside the panel doesn't fall through
    // to dimZone underneath and immediately close it — a no-op handler
    // is enough since Phaser processes overlapping interactive objects
    // independently rather than stopping at the first hit.
    const panelZone = track(this.add.zone(WIDTH / 2, panelY + panelH / 2, panelW, panelH).setDepth(101));
    panelZone.setInteractive();
    panelZone.on('pointerdown', () => {});

    track(this.add.text(WIDTH / 2, panelY + 30, 'How to Play', {
      fontFamily: 'sans-serif',
      fontSize: '24px',
      fontStyle: 'bold',
      color: '#ffffff'
    }).setOrigin(0.5).setDepth(102));

    lines.forEach((line, i) => {
      track(this.add.text(WIDTH / 2, panelY + 62 + i * 34, line, {
        fontFamily: 'sans-serif',
        fontSize: '14px',
        color: '#eaf4ff',
        align: 'center',
        wordWrap: { width: panelW - 50 }
      }).setOrigin(0.5).setDepth(102));
    });

    const closeBtnW = 110, closeBtnH = 36;
    const closeBtnY = panelY + panelH - closeBtnH - 16;

    const closeBox = track(this.add.graphics().setDepth(102));
    closeBox.fillStyle(0x1a1a1a, 0.8);
    closeBox.fillRoundedRect(WIDTH / 2 - closeBtnW / 2, closeBtnY, closeBtnW, closeBtnH, 8);
    closeBox.lineStyle(1, 0xffffff, 0.7);
    closeBox.strokeRoundedRect(WIDTH / 2 - closeBtnW / 2, closeBtnY, closeBtnW, closeBtnH, 8);

    track(this.add.text(WIDTH / 2, closeBtnY + closeBtnH / 2, 'Close', {
      fontFamily: 'sans-serif',
      fontSize: '16px',
      fontStyle: 'bold',
      color: '#ffffff'
    }).setOrigin(0.5).setDepth(103));

    const closeZone = track(this.add.zone(WIDTH / 2, closeBtnY + closeBtnH / 2, closeBtnW, closeBtnH).setDepth(103));
    closeZone.setInteractive({ useHandCursor: true });
    closeZone.on('pointerdown', () => close());

    const close = () => {
      this.controlsOpen = false;
      nicknameInput.style.visibility = 'visible';
      objects.forEach((o) => o.destroy());
    };
  }

  startGame() {
    const nicknameInput = document.getElementById('nickname-input');
    const nickname = nicknameInput.value.trim().slice(0, 16);
    localStorage.setItem('nickname', nickname);
    nicknameInput.style.display = 'none';
    nicknameInput.blur(); // drop focus so a leftover keydown listener elsewhere doesn't type into it
    this.scene.start('MainScene');
  }
}

class MainScene extends Phaser.Scene {
  constructor() {
    super('MainScene');
  }

  preload() {
    // No external image assets for the MVP — we draw everything
    // procedurally with Phaser Graphics and bake it into textures.
    this.createWaterTileTexture();
    this.createCanoeTexture();
    this.createRockTexture();
    this.createDriftwoodTexture();
    this.createSunkTexture();
    this.createHookTexture();
    this.createFishTexture();
    this.createSharkTexture();
    this.createUpgradeIconTextures();
  }

  create() {
    // Read fresh from localStorage rather than trusting scene-start data,
    // so this stays correct across a Phaser restart (R key, the Restart
    // button) too — neither goes back through TitleScene, which is the
    // only place that writes it.
    this.nickname = localStorage.getItem('nickname') || '';

    // The hint bar lists WASD/click/H/R — all keyboard-or-mouse only, so
    // it's both useless and in the way (it overlaps the lake on a short
    // screen) for touch players, who have the joystick and hook button.
    document.getElementById('hint').style.display = IS_TOUCH_DEVICE ? 'none' : 'block';

    // Water: a small repeating tile (see createWaterTileTexture()) rather
    // than one image baked at the full world size — a WORLD_WIDTH x
    // WORLD_HEIGHT raster texture would be tens of MB of GPU memory, a
    // real risk on lower-end mobile. Border/beach/grass ring drawn
    // straight into the scene in createBorderGraphics(), for the same
    // reason — see its comment for why that one's fine left un-baked.
    this.add.tileSprite(0, 0, WORLD_WIDTH, WORLD_HEIGHT, 'waterTileTexture').setOrigin(0, 0);
    this.createBorderGraphics();

    // Spawn away from dead-center, since a rock sits there — see
    // ROCK_POSITIONS. World-space now, so this is the same actual
    // distance into the water for every player, not just the same
    // relative distance on their own screen.
    const spawnOffset = 90;
    this.boat = this.matter.add.sprite(BORDER + spawnOffset, WORLD_HEIGHT - BORDER - spawnOffset, 'canoeTexture');
    this.boat.setScale(WORLD_OBJECT_SCALE);
    this.boat.health = MAX_HEALTH;
    this.boat.lastHitTime = 0;
    this.boat.setDepth(DEPTH_BOAT); // above fish, so it doesn't submerge under the boat

    // Mutable copies of the starting speed/range — upgrades increment
    // these at runtime, so they can't stay plain constants.
    this.boatSpeed = BOAT_SPEED;
    this.hookRange = HOOK_RANGE;
    this.hookSpeed = HOOK_SPEED;

    // Timestamp (this.time.now) until which boat controls are locked —
    // set when a caught shark reaches the boat. 0 means not stunned.
    this.stunnedUntil = 0;

    // Give the boat a rectangular hitbox matching just the hull
    // silhouette. Unlike Arcade Physics, Matter bodies rotate together
    // with the sprite, so the hitbox now genuinely tracks the boat's
    // facing direction instead of staying a flat axis-aligned box.
    this.boat.setRectangle(HITBOX_W, HITBOX_H);
    // We drive rotation ourselves from the velocity vector each frame
    // (see update()), so lock out Matter's own collision-driven
    // spin — otherwise bumping the rock at an angle could leave the
    // boat spinning until the next key press overwrites it.
    this.boat.setFixedRotation();

    // Constrain movement to the water area, not the full canvas, so
    // the boat can never drive onto the land border. Matter models
    // this as real static wall bodies around the given rectangle.
    this.matter.world.setBounds(WATER_LEFT, WATER_TOP, LAKE_W, LAKE_H);

    // Camera follows the boat around the world (see WORLD_WIDTH/HEIGHT
    // above) instead of the old "the whole lake always fits on screen"
    // model — this is the actual "zoomed in, .io-game style" effect the
    // player sees; the base zoom is 1 (boat size, hitboxes, etc. all
    // stay pixel-identical to before) — the only zoom that ever kicks in
    // is the range-triggered one below, see updateRangeZoom(). A small
    // lerp gives a smooth trailing camera rather than a rigid
    // snap-to-boat every frame.
    this.cameras.main.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
    this.cameras.main.startFollow(this.boat, true, 0.08, 0.08);
    this.updateRangeZoom(false); // set correctly from the start, in case a short screen ever needs it at base HOOK_RANGE too

    // Rocks scattered across the lake (see ROCK_POSITIONS). Static —
    // they never move — but still need a physics body to collide with.
    // A circular body suits a round rock better than a rectangle would.
    this.rocks = ROCK_POSITIONS.map(({ nx, ny }) => {
      const pos = this.fromLakeFraction(nx, ny);
      const rock = this.matter.add.image(pos.x, pos.y, 'rockTexture');
      rock.setScale(WORLD_OBJECT_SCALE);
      rock.setCircle(ROCK_RADIUS * WORLD_OBJECT_SCALE);
      rock.setStatic(true);
      return rock;
    });

    // Driftwood — see DRIFTWOOD_CONFIGS/updateDriftwood() for the
    // deterministic wall-clock movement that keeps it synced across
    // players for free. The Matter body is static (like the rocks
    // above) but manually repositioned every frame instead of never
    // moving — the standard Matter.js way to give a "kinematic"
    // obstacle a real physics presence: dynamic bodies (the boat)
    // still collide with it correctly wherever it currently is, but it
    // isn't itself pushed or slowed by anything it hits.
    this.driftwood = DRIFTWOOD_CONFIGS.map((driftConfig) => {
      const sprite = this.matter.add.image(0, 0, 'driftwoodTexture');
      sprite.setScale(WORLD_OBJECT_SCALE);
      // Same rectangle for both — rotating a game object's body angle
      // (see below) also rotates its Matter body in place, so building
      // the body pre-rotated here as well would double up and leave
      // the vertical piece's hitbox pointing the wrong way again.
      sprite.setRectangle(DRIFTWOOD_LEN * WORLD_OBJECT_SCALE, DRIFTWOOD_WIDTH * WORLD_OBJECT_SCALE);
      if (driftConfig.axis === 'y') {
        // Texture is drawn lying flat (long edge horizontal); rotating
        // a quarter turn makes both the visible log and its physics
        // body (rotation stays in sync with the body's angle) point
        // along its actual direction of travel instead of sideways.
        sprite.setRotation(Math.PI / 2);
      }
      sprite.setStatic(true);
      return { sprite, config: driftConfig };
    });
    this.updateDriftwood(); // position correctly before the first frame renders

    // A rock or driftwood contact deals the same damage (see
    // hitObstacle()), so every hazard body — moving or not — goes in
    // one set rather than special-casing which kind was hit. Matter
    // fires 'collisionstart' once per new contact (not every frame of
    // overlap like Arcade's collider), a natural fit for "you just hit
    // something" rather than continuous damage.
    const hazardBodies = new Set([
      ...this.rocks.map((r) => r.body),
      ...this.driftwood.map((d) => d.sprite.body)
    ]);
    this.matter.world.on('collisionstart', (event) => {
      for (const pair of event.pairs) {
        const involvesBoat = pair.bodyA === this.boat.body || pair.bodyB === this.boat.body;
        if (!involvesBoat) continue;
        const other = pair.bodyA === this.boat.body ? pair.bodyB : pair.bodyA;
        if (hazardBodies.has(other)) this.hitObstacle();
      }
    });

    this.keys = this.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.W,
      down: Phaser.Input.Keyboard.KeyCodes.S,
      left: Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D
    });

    // Debug view of the boat's hitbox — press H to toggle.
    this.hitboxGraphics = this.add.graphics();
    this.showHitbox = false;
    this.input.keyboard.on('keydown-H', () => {
      this.showHitbox = !this.showHitbox;
      if (!this.showHitbox) this.hitboxGraphics.clear();
    });

    // Health bar — redrawn every frame in update() so it can track
    // the boat's position without being a child of the (rotating) sprite.
    this.healthBarGraphics = this.add.graphics();

    // "Shark Attack" callout — shown above the boat for as long as the
    // shark stun is active, repositioned each frame in update().
    this.sharkAttackText = this.add.text(0, 0, 'Shark Attack', {
      fontFamily: 'sans-serif',
      fontSize: '14px',
      fontStyle: 'bold',
      color: '#ff4444',
      stroke: '#000000',
      strokeThickness: 3
    }).setOrigin(0.5).setDepth(DEPTH_BOAT + 1).setVisible(false);

    // "Ouch" callout — shown above the boat briefly after another
    // player's hook hits us, set by handleIncomingHit().
    this.ouchUntil = 0;
    this.ouchText = this.add.text(0, 0, 'Ouch', {
      fontFamily: 'sans-serif',
      fontSize: '14px',
      fontStyle: 'bold',
      color: '#ffb84d',
      stroke: '#000000',
      strokeThickness: 3
    }).setOrigin(0.5).setDepth(DEPTH_BOAT + 1).setVisible(false);

    // Hook — a plain (non-physics) sprite we move by hand each frame,
    // plus a graphics object for the rope line connecting it to the
    // boat. 'idle' means docked/hidden; a click sends it 'out' toward
    // the target, and once it arrives it flips to 'returning' and
    // chases the boat's current position (which may have moved) back.
    this.hook = this.add.image(this.boat.x, this.boat.y, 'hookTexture');
    this.hook.setScale(WORLD_OBJECT_SCALE);
    this.hook.setVisible(false);
    this.hookState = 'idle';
    this.hookTarget = { x: 0, y: 0 };
    this.hookGraphics = this.add.graphics();

    // Faint circle around the boat marking max cast distance — redrawn
    // each frame in update() since it has to track the boat's position.
    this.hookRangeGraphics = this.add.graphics();

    // Click-to-aim is a mouse/desktop thing — on touch devices the hook
    // button (see createTouchControls()) is the only way to cast, so a
    // stray tap while dragging the joystick can't also fire a cast.
    if (!IS_TOUCH_DEVICE) {
      this.input.on('pointerdown', (pointer) => {
        if (this.gameOver || this.hookState !== 'idle') return;
        // Screen-space check (pointer.y), not world-space — the HUD is a
        // fixed screen overlay now, not part of the scrolling world, so
        // it no longer corresponds to any particular world coordinate.
        if (pointer.y < TOP_HUD_HEIGHT) return; // clicks on the HUD strip shouldn't cast the hook
        this.castHookToward(pointer.worldX, pointer.worldY);
      });
    }

    // Spacebar — auto-aims at the nearest catchable thing in range
    // (a swimming fish/shark, or another player's boat) instead of
    // requiring a precise click. Does nothing if nothing's in range.
    // Same auto-aim used by the touch hook button.
    this.input.keyboard.on('keydown-SPACE', () => this.tryAutoAimCast());

    if (IS_TOUCH_DEVICE) this.createTouchControls();

    // Fish — each swims a fixed circle around its own spawn point,
    // drawn as a dark translucent silhouette to read as "under the
    // water". Capped at FISH_MAX concurrently; a repeating timer tops
    // the pool back up as fish get caught and delivered.
    this.fish = [];
    this.hookedFish = null;
    for (let i = 0; i < FISH_MAX; i++) this.spawnFish();
    this.time.addEvent({
      delay: FISH_SPAWN_INTERVAL_MS,
      loop: true,
      callback: () => { if (!this.gameOver) this.spawnFish(); }
    });

    // Sharks share the same array/movement/catch machinery as fish
    // (flagged via isShark) — see spawnShark(). No initial population;
    // they only appear from this timer, every 30s if under the cap.
    this.time.addEvent({
      delay: SHARK_SPAWN_INTERVAL_MS,
      loop: true,
      callback: () => { if (!this.gameOver) this.spawnShark(); }
    });

    // Fish-caught counter, boxed in the top-left corner of the screen —
    // a fixed HUD overlay now (setScrollFactor(0)), not part of the
    // scrolling world, so it stays put as the camera follows the boat.
    this.fishCount = 0;
    const hudX = Math.round(10 * UI_SCALE), hudY = Math.round(10 * UI_SCALE), hudW = Math.round(100 * UI_SCALE), hudH = Math.round(32 * UI_SCALE);
    this.add.graphics()
      .fillStyle(0x1a1a1a, 0.55)
      .fillRoundedRect(hudX, hudY, hudW, hudH, 6)
      .lineStyle(1, 0xffffff, 0.4)
      .strokeRoundedRect(hudX, hudY, hudW, hudH, 6)
      .setScrollFactor(0);
    this.fishHudText = this.add.text(hudX + hudW / 2, hudY + hudH / 2, 'Fish: 0', {
      fontFamily: 'sans-serif',
      fontSize: Math.round(15 * UI_SCALE) + 'px',
      color: '#ffffff'
    }).setOrigin(0.5).setScrollFactor(0);

    // Shop — a row of icon buttons, top-right, bought with caught fish.
    this.createUpgradeButtons();

    // Game over state, restart key, and message
    this.gameOver = false;
    this.input.keyboard.on('keydown-R', () => {
      this.scene.restart();
    });
    this.gameOverText = this.add.text(WIDTH / 2, HEIGHT / 2, 'Your boat sank!\nPress R or tap below to restart', {
      fontFamily: 'sans-serif',
      fontSize: '28px',
      color: '#ffffff',
      align: 'center',
      stroke: '#000000',
      strokeThickness: 4
    }).setOrigin(0.5).setScrollFactor(0).setVisible(false);

    // Restart button — R has no touch equivalent, so this is how
    // mobile players (or anyone else) restart after sinking. Only
    // shown/interactive once actually game over (see sinkBoat()).
    const restartBtnW = Math.round(160 * TOUCH_UI_SCALE);
    const restartBtnH = Math.round(50 * TOUCH_UI_SCALE);
    const restartBtnX = WIDTH / 2 - restartBtnW / 2;
    const restartBtnY = HEIGHT / 2 + Math.round(40 * TOUCH_UI_SCALE);

    this.restartButtonBox = this.add.graphics().setDepth(DEPTH_TOUCH_UI).setScrollFactor(0).setVisible(false);
    this.restartButtonBox.fillStyle(0x1a1a1a, 0.75);
    this.restartButtonBox.fillRoundedRect(restartBtnX, restartBtnY, restartBtnW, restartBtnH, 10);
    this.restartButtonBox.lineStyle(2, 0xffffff, 0.8);
    this.restartButtonBox.strokeRoundedRect(restartBtnX, restartBtnY, restartBtnW, restartBtnH, 10);

    this.restartButtonText = this.add.text(WIDTH / 2, restartBtnY + restartBtnH / 2, 'Restart', {
      fontFamily: 'sans-serif',
      fontSize: Math.round(22 * UI_SCALE) + 'px',
      fontStyle: 'bold',
      color: '#ffffff'
    }).setOrigin(0.5).setDepth(DEPTH_TOUCH_UI).setScrollFactor(0).setVisible(false);

    const restartZone = this.add.zone(WIDTH / 2, restartBtnY + restartBtnH / 2, restartBtnW, restartBtnH).setScrollFactor(0);
    restartZone.setInteractive({ useHandCursor: true });
    restartZone.on('pointerdown', () => {
      if (!this.gameOver) return;
      this.scene.restart();
    });

    // Minimap — top-right, stacked below the upgrade-shop row (clear of
    // the touch joystick/hook button in the bottom corners). See
    // createMinimap()/drawMinimap() for why it's hand-drawn rather than
    // a second Phaser camera.
    this.createMinimap();

    this.setupMultiplayer();
  }

  // Positions are synced as a fraction of the lake (0..1 on each axis)
  // rather than raw pixels. Originally this was because every player's
  // lake was sized to their own window; now that WORLD_WIDTH/HEIGHT is
  // one fixed size shared by everyone, a fraction and a raw world pixel
  // coordinate are equivalent up to a constant scale factor — kept as a
  // fraction anyway since rocks/driftwood already define their positions
  // this way (see ROCK_POSITIONS), and it means nothing here needed to
  // change when the world stopped being screen-sized.
  toLakeFraction(x, y) {
    return {
      nx: (x - WATER_LEFT) / LAKE_W,
      ny: (y - WATER_TOP) / LAKE_H
    };
  }

  // Inverse of toLakeFraction, into world pixel space (the same for
  // every player now). Returns null for missing/garbage input rather
  // than propagating NaN into sprite positions — a record written by an
  // older build (pixels, no nx/ny) would otherwise place a boat at NaN
  // and make it vanish confusingly. Such records get overwritten within
  // a sync tick anyway.
  fromLakeFraction(nx, ny) {
    if (!Number.isFinite(nx) || !Number.isFinite(ny)) return null;
    return {
      x: WATER_LEFT + nx * LAKE_W,
      y: WATER_TOP + ny * LAKE_H
    };
  }

  // Writes this player's own boat state to Firebase and renders every
  // other player's boat from the same shared /players path.
  setupMultiplayer() {
    this.playerRef = db.ref('players/' + playerId);
    this.playerRef.onDisconnect().remove(); // clean up if the tab closes/loses connection
    this.networkSyncAccum = 0;

    this.remoteBoats = {}; // playerId -> { sprite, label, healthBarGraphics }

    this.playersRef = db.ref('players');
    this.playersRef.on('child_added', (snap) => {
      if (snap.key === playerId) return; // that's us
      this.addRemoteBoat(snap.key, snap.val());
    });
    this.playersRef.on('child_changed', (snap) => {
      if (snap.key === playerId) return;
      this.updateRemoteBoat(snap.key, snap.val());
    });
    this.playersRef.on('child_removed', (snap) => {
      if (snap.key === playerId) return;
      this.removeRemoteBoat(snap.key);
    });

    // Our own "hits" inbox — other players push here when their hook
    // tags our boat (see hitOpponent()); we're the ones who apply the
    // damage/fish loss to our own state, then remove the entry so it
    // isn't processed twice.
    this.hitsRef = db.ref('hits/' + playerId);
    this.hitsRef.on('child_added', (snap) => this.handleIncomingHit(snap));

    // Detach listeners and clear our own record when this scene instance
    // ends (restart or otherwise) so they don't pile up across restarts.
    this.events.once(Phaser.Scenes.Events.SHUTDOWN, () => {
      this.playersRef.off();
      this.hitsRef.off();
      this.playerRef.onDisconnect().cancel();
      this.playerRef.remove();
    });
  }

  handleIncomingHit(snap) {
    const hit = snap.val();
    snap.ref.remove(); // acknowledge — don't process the same hit twice
    if (this.gameOver) return;
    this.applyDamage(PLAYER_HIT_DAMAGE_PERCENT);
    const stolen = Math.min(hit.fishStolen || 0, this.fishCount);
    this.fishCount -= stolen;
    this.fishHudText.setText('Fish: ' + this.fishCount);
    this.ouchUntil = this.time.now + OUCH_TEXT_DURATION_MS;
  }

  addRemoteBoat(id, data) {
    if (this.remoteBoats[id]) return;
    const pos = this.fromLakeFraction(data.nx, data.ny);
    if (!pos) return; // unusable record — the next sync tick will bring a good one
    const sprite = this.add.image(pos.x, pos.y, data.sunk ? 'sunkTexture' : 'canoeTexture');
    sprite.setScale(WORLD_OBJECT_SCALE); // same fixed world scale as our own boat — a real boat size everyone agrees on now, not a per-viewer approximation
    sprite.rotation = data.rotation || 0;
    sprite.setDepth(DEPTH_BOAT);
    // Text set in updateRemoteBoat() below (called immediately after this),
    // not here — it depends on data.nickname, which may arrive/change on
    // any sync, not just this first one.
    const label = this.add.text(pos.x, pos.y - REMOTE_LABEL_OFFSET_Y, '', {
      fontFamily: 'sans-serif',
      fontSize: Math.round(REMOTE_LABEL_FONT_BASE * TOUCH_UI_SCALE) + 'px',
      color: '#ffffff',
      stroke: '#000000',
      strokeThickness: 2
    }).setOrigin(0.5).setDepth(DEPTH_BOAT + 1);
    const healthBarGraphics = this.add.graphics();

    // Their hook — drawn exactly like our own (sprite plus a rope line
    // back to the boat), so a cast is visible to everyone, not just the
    // player making it.
    const hookSprite = this.add.image(pos.x, pos.y, 'hookTexture');
    hookSprite.setScale(WORLD_OBJECT_SCALE);
    hookSprite.setDepth(DEPTH_BOAT);
    hookSprite.setVisible(false);
    const hookGraphics = this.add.graphics();

    this.remoteBoats[id] = { sprite, label, healthBarGraphics, hookSprite, hookGraphics };
    this.updateRemoteBoat(id, data);
  }

  updateRemoteBoat(id, data) {
    const remote = this.remoteBoats[id];
    if (!remote) { this.addRemoteBoat(id, data); return; }
    const pos = this.fromLakeFraction(data.nx, data.ny);
    if (!pos) return; // leave the boat where it was rather than jumping it somewhere invalid
    remote.data = data; // last-known state, read by the hit-detection check in updateHook()
    remote.sprite.setTexture(data.sunk ? 'sunkTexture' : 'canoeTexture');
    remote.sprite.setPosition(pos.x, pos.y);
    remote.sprite.rotation = data.rotation || 0;
    remote.label.setText(data.nickname || 'Player');
    remote.label.setPosition(pos.x, pos.y - REMOTE_LABEL_OFFSET_Y);

    const g = remote.healthBarGraphics;
    g.clear();
    if (!data.sunk) {
      const pct = (data.health != null ? data.health : MAX_HEALTH) / MAX_HEALTH;
      const barX = pos.x - HEALTH_BAR_WIDTH / 2;
      const barY = pos.y + HEALTH_BAR_OFFSET_Y;
      g.fillStyle(0x2b2b2b, 0.7);
      g.fillRect(barX, barY, HEALTH_BAR_WIDTH, HEALTH_BAR_HEIGHT);
      const fillColor = pct > 0.5 ? 0x4caf50 : (pct > 0.25 ? 0xf0ad4e : 0xd9534f);
      g.fillStyle(fillColor, 1);
      g.fillRect(barX, barY, HEALTH_BAR_WIDTH * pct, HEALTH_BAR_HEIGHT);
      g.lineStyle(1, 0x111111, 0.9);
      g.strokeRect(barX, barY, HEALTH_BAR_WIDTH, HEALTH_BAR_HEIGHT);
    }

    const hookPos = data.hookOut ? this.fromLakeFraction(data.hookNx, data.hookNy) : null;
    remote.hookGraphics.clear();
    if (hookPos && !data.sunk) {
      remote.hookSprite.setPosition(hookPos.x, hookPos.y);
      remote.hookSprite.setVisible(true);
      remote.hookGraphics.lineStyle(2, 0x3a2a1a, 0.8);
      remote.hookGraphics.lineBetween(pos.x, pos.y, hookPos.x, hookPos.y);
    } else {
      remote.hookSprite.setVisible(false);
    }
  }

  removeRemoteBoat(id) {
    const remote = this.remoteBoats[id];
    if (!remote) return;
    remote.sprite.destroy();
    remote.label.destroy();
    remote.healthBarGraphics.destroy();
    remote.hookSprite.destroy();
    remote.hookGraphics.destroy();
    delete this.remoteBoats[id];
  }

  hitObstacle() {
    if (this.gameOver) return;
    const now = this.time.now;
    if (now < this.boat.lastHitTime + HIT_COOLDOWN_MS) return; // still on cooldown
    this.boat.lastHitTime = now;
    this.applyDamage(DAMAGE_PERCENT);
  }

  // Moves each driftwood piece to its current wall-clock-time position
  // (see DRIFTWOOD_CONFIGS above for why Date.now() rather than the
  // scene's own elapsed time). setPosition() on a Matter game object
  // moves the underlying body too, not just the sprite, so collision
  // detection stays correct even though the body is static.
  updateDriftwood() {
    const now = Date.now();
    for (const dw of this.driftwood) {
      // Crossing time is derived from a fixed world px/sec speed and the
      // dimension this piece actually crosses (LAKE_W or LAKE_H, which
      // may differ) — not a fixed duration — so driftwood moves at the
      // same real speed regardless of how big the world is. See
      // DRIFTWOOD_SPEED's comment for why that matters.
      const dimension = dw.config.axis === 'x' ? LAKE_W : LAKE_H;
      const periodMs = (dimension / DRIFTWOOD_SPEED) * 1000;
      const cycle = (now + dw.config.phase * periodMs) % periodMs;
      const t = cycle / periodMs; // 0..1 sweep, wrapping = "respawn on the opposite edge"
      const nx = dw.config.axis === 'x' ? t : dw.config.cross;
      const ny = dw.config.axis === 'y' ? t : dw.config.cross;
      const pos = this.fromLakeFraction(nx, ny);
      dw.sprite.setPosition(pos.x, pos.y);
    }
  }

  applyDamage(percent) {
    this.boat.health = Math.max(0, this.boat.health - percent);
    if (this.boat.health <= 0) this.sinkBoat();
  }

  sinkBoat() {
    this.gameOver = true;
    this.boat.setTexture('sunkTexture'); // hull disappears, fisherman remains — the boat sank
    this.boat.clearTint(); // in case it sank while showing the shark-stun tint
    this.sharkAttackText.setVisible(false);
    this.boat.setVelocity(0, 0);
    this.boat.setStatic(true); // freeze it in place; controls are disabled anyway
    this.healthBarGraphics.clear();
    this.hitboxGraphics.clear();
    this.hookGraphics.clear();
    this.hookRangeGraphics.clear();
    this.hook.setVisible(false);
    this.hookState = 'idle';
    if (this.hookedFish) {
      this.hookedFish.destroy();
      this.fish = this.fish.filter((f) => f !== this.hookedFish);
      this.hookedFish = null;
    }
    this.refreshUpgradeButtons(); // gray out the shop — nothing's purchasable once sunk
    this.gameOverText.setVisible(true);
    this.restartButtonBox.setVisible(true);
    this.restartButtonText.setVisible(true);

    // update() (which normally sends our periodic position sync) bails
    // out early once gameOver is set, so push the final sunk state once
    // here — otherwise other players would see our last-known position
    // frozen mid-lake without any indication we'd actually sunk.
    // hookOut:false too, or a hook that was mid-flight when we sank
    // would stay frozen on other players' screens forever.
    if (this.playerRef) this.playerRef.update({ health: 0, fishCount: this.fishCount, sunk: true, hookOut: false });
  }

  update(time, delta) {
    if (this.gameOver) return; // controls disabled once the boat has sunk; press R to restart

    const stunned = time < this.stunnedUntil; // set when a caught shark reaches the boat
    if (stunned) {
      this.boat.setTint(SHARK_STUN_TINT);
      this.sharkAttackText.setPosition(this.boat.x, this.boat.y + SHARK_ATTACK_TEXT_OFFSET_Y);
      this.sharkAttackText.setVisible(true);
    } else {
      this.boat.clearTint();
      this.sharkAttackText.setVisible(false);
    }

    const showingOuch = time < this.ouchUntil; // set when another player's hook hits us
    if (showingOuch) {
      this.ouchText.setPosition(this.boat.x, this.boat.y + OUCH_TEXT_OFFSET_Y);
      this.ouchText.setVisible(true);
    } else {
      this.ouchText.setVisible(false);
    }

    let vx = 0;
    let vy = 0;

    if (!stunned) {
      if (this.keys.left.isDown) vx -= 1;
      if (this.keys.right.isDown) vx += 1;
      if (this.keys.up.isDown) vy -= 1;
      if (this.keys.down.isDown) vy += 1;

      // Joystick direction wins over WASD when it's actively being
      // dragged — same "just a direction, always full speed" feel as
      // WASD, not a variable/analog speed.
      if (IS_TOUCH_DEVICE && (this.joystickVector.x !== 0 || this.joystickVector.y !== 0)) {
        vx = this.joystickVector.x;
        vy = this.joystickVector.y;
      }

      if (vx !== 0 || vy !== 0) {
        const len = Math.sqrt(vx * vx + vy * vy);
        vx = (vx / len) * this.boatSpeed;
        vy = (vy / len) * this.boatSpeed;
        this.boat.rotation = Math.atan2(vy, vx);
      }
    }

    // Matter velocity is expressed per simulation step (effectively
    // per 1/60th of a second at the default rate), not per second like
    // Arcade's. Dividing by 60 keeps the on-screen speed matching what
    // this.boatSpeed describes; without this the boat would rocket across
    // the screen almost instantly.
    this.boat.setVelocity(vx / 60, vy / 60);

    if (this.showHitbox) {
      // Draw the body's actual vertices — Matter keeps these updated
      // in world space as the body rotates, so this polygon visibly
      // turns together with the boat instead of staying axis-aligned.
      const verts = this.boat.body.vertices;
      this.hitboxGraphics.clear();
      this.hitboxGraphics.lineStyle(2, 0xff3333, 1);
      this.hitboxGraphics.beginPath();
      this.hitboxGraphics.moveTo(verts[0].x, verts[0].y);
      for (let i = 1; i < verts.length; i++) {
        this.hitboxGraphics.lineTo(verts[i].x, verts[i].y);
      }
      this.hitboxGraphics.closePath();
      this.hitboxGraphics.strokePath();
    }

    this.drawHealthBar();
    this.drawHookRange();
    this.updateFish(delta);
    this.updateHook(delta);
    this.updateDriftwood();
    this.drawMinimap();
    this.refreshUpgradeButtons();

    // Throttled outgoing sync — writing every frame would be far more
    // Firebase traffic than needed for boats that move at a walking pace.
    this.networkSyncAccum += delta;
    if (this.networkSyncAccum >= NETWORK_SYNC_INTERVAL_MS) {
      this.networkSyncAccum = 0;
      const boatPos = this.toLakeFraction(this.boat.x, this.boat.y);
      // Hook rides along in the same payload so other players can see it
      // mid-cast, not just the boat it came from.
      const hookOut = this.hookState !== 'idle';
      const hookPos = hookOut
        ? this.toLakeFraction(this.hook.x, this.hook.y)
        : { nx: boatPos.nx, ny: boatPos.ny };
      this.playerRef.set({
        nx: boatPos.nx,
        ny: boatPos.ny,
        rotation: this.boat.rotation,
        health: this.boat.health,
        fishCount: this.fishCount,
        sunk: false,
        hookOut,
        hookNx: hookPos.nx,
        hookNy: hookPos.ny,
        nickname: this.nickname
      });
    }
  }

  drawHookRange() {
    this.hookRangeGraphics.clear();
    this.hookRangeGraphics.lineStyle(1, HOOK_RANGE_COLOR, HOOK_RANGE_ALPHA);
    this.hookRangeGraphics.strokeCircle(this.boat.x, this.boat.y, this.hookRange);
  }

  // Keeps the range circle on screen as the Hook Range upgrade grows it:
  // solves directly for the zoom that fits the circle (plus a margin)
  // inside the smaller screen dimension, rather than a fixed zoom step
  // per upgrade, so it adapts to whatever screen it's running on. Floored
  // at MIN_RANGE_ZOOM since the upgrade is repeatable with no cap.
  updateRangeZoom(animate) {
    const available = Math.min(WIDTH, HEIGHT) / 2 - ZOOM_RANGE_MARGIN;
    const targetZoom = Phaser.Math.Clamp(available / this.hookRange, MIN_RANGE_ZOOM, 1);
    if (animate) this.cameras.main.zoomTo(targetZoom, 500, 'Sine.easeInOut');
    else this.cameras.main.setZoom(targetZoom);
  }

  // Shared by both the click handler and the spacebar auto-aim: sends
  // the hook out from the boat toward (targetX, targetY), clamped to
  // the current hook range.
  castHookToward(targetX, targetY) {
    const dx = targetX - this.boat.x;
    const dy = targetY - this.boat.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > this.hookRange) {
      // Beyond range — clamp the cast to the edge of the range circle
      // in that direction, rather than ignoring it.
      const scale = this.hookRange / dist;
      this.hookTarget.x = this.boat.x + dx * scale;
      this.hookTarget.y = this.boat.y + dy * scale;
    } else {
      this.hookTarget.x = targetX;
      this.hookTarget.y = targetY;
    }
    this.hook.setPosition(this.boat.x, this.boat.y);
    this.hook.setVisible(true);
    this.hookState = 'out';
  }

  // The closest swimming fish/shark or other player's (non-sunk) boat
  // within hookRange, or null if nothing qualifies — used by the
  // spacebar auto-aim.
  findNearestEntityInRange() {
    let nearest = null;
    let nearestDistSq = this.hookRange * this.hookRange;

    for (const fish of this.fish) {
      if (fish.fishState !== 'swimming') continue;
      const dx = fish.x - this.boat.x;
      const dy = fish.y - this.boat.y;
      const distSq = dx * dx + dy * dy;
      if (distSq <= nearestDistSq) {
        nearestDistSq = distSq;
        nearest = { x: fish.x, y: fish.y };
      }
    }

    for (const id in this.remoteBoats) {
      const remote = this.remoteBoats[id];
      if (!remote.data || remote.data.sunk) continue;
      const dx = remote.sprite.x - this.boat.x;
      const dy = remote.sprite.y - this.boat.y;
      const distSq = dx * dx + dy * dy;
      if (distSq <= nearestDistSq) {
        nearestDistSq = distSq;
        nearest = { x: remote.sprite.x, y: remote.sprite.y };
      }
    }

    return nearest;
  }

  // Casts at the nearest catchable thing in range, if there is one.
  // Shared by the spacebar key and the touch hook button.
  tryAutoAimCast() {
    if (this.gameOver || this.hookState !== 'idle') return;
    const target = this.findNearestEntityInRange();
    if (!target) return;
    this.castHookToward(target.x, target.y);
  }

  // Virtual joystick (bottom-left, drives this.joystickVector, read in
  // update()) and hook button (bottom-right, casts via tryAutoAimCast())
  // for touch devices — see IS_TOUCH_DEVICE. Both sit at a fixed screen
  // position, same convention as the rest of the HUD.
  createTouchControls() {
    const jx = JOYSTICK_MARGIN;
    const jy = HEIGHT - JOYSTICK_MARGIN;
    this.joystickCenter = { x: jx, y: jy };
    this.joystickVector = { x: 0, y: 0 }; // normalized -1..1, read by update()
    this.joystickPointerId = null;

    const joystickBase = this.add.graphics().setDepth(DEPTH_TOUCH_UI).setScrollFactor(0);
    joystickBase.fillStyle(0xffffff, 0.15);
    joystickBase.fillCircle(jx, jy, JOYSTICK_BASE_RADIUS);
    joystickBase.lineStyle(2, 0xffffff, 0.4);
    joystickBase.strokeCircle(jx, jy, JOYSTICK_BASE_RADIUS);

    this.joystickStick = this.add.graphics().setDepth(DEPTH_TOUCH_UI).setScrollFactor(0);
    this.drawJoystickStick(0, 0);

    const joystickZone = this.add.zone(jx, jy, JOYSTICK_BASE_RADIUS * 2.4, JOYSTICK_BASE_RADIUS * 2.4).setScrollFactor(0);
    joystickZone.setInteractive();
    joystickZone.on('pointerdown', (pointer) => {
      this.joystickPointerId = pointer.id;
      this.updateJoystickFromPointer(pointer);
    });

    // Global, not zone-scoped — a drag can wander outside the zone's
    // bounds once it's already active, and we still need to track it.
    this.input.on('pointermove', (pointer) => {
      if (pointer.id === this.joystickPointerId) this.updateJoystickFromPointer(pointer);
    });
    this.input.on('pointerup', (pointer) => {
      if (pointer.id === this.joystickPointerId) {
        this.joystickPointerId = null;
        this.joystickVector.x = 0;
        this.joystickVector.y = 0;
        this.drawJoystickStick(0, 0);
      }
    });

    const hx = WIDTH - HOOK_BUTTON_MARGIN;
    const hy = HEIGHT - HOOK_BUTTON_MARGIN;
    const hookButtonGraphics = this.add.graphics().setDepth(DEPTH_TOUCH_UI).setScrollFactor(0);
    hookButtonGraphics.fillStyle(0x1a1a1a, 0.5);
    hookButtonGraphics.fillCircle(hx, hy, HOOK_BUTTON_RADIUS);
    hookButtonGraphics.lineStyle(2, 0xffffff, 0.6);
    hookButtonGraphics.strokeCircle(hx, hy, HOOK_BUTTON_RADIUS);
    this.add.image(hx, hy, 'hookTexture').setScale(2.5 * TOUCH_UI_SCALE).setDepth(DEPTH_TOUCH_UI + 1).setScrollFactor(0);

    const hookZone = this.add.zone(hx, hy, HOOK_BUTTON_RADIUS * 2, HOOK_BUTTON_RADIUS * 2).setScrollFactor(0);
    hookZone.setInteractive();
    hookZone.on('pointerdown', () => this.tryAutoAimCast());
  }

  updateJoystickFromPointer(pointer) {
    const dx = pointer.x - this.joystickCenter.x;
    const dy = pointer.y - this.joystickCenter.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const clampedDist = Math.min(dist, JOYSTICK_BASE_RADIUS);

    this.drawJoystickStick(
      dist > 0 ? (dx / dist) * clampedDist : 0,
      dist > 0 ? (dy / dist) * clampedDist : 0
    );

    if (dist < JOYSTICK_DEADZONE) {
      this.joystickVector.x = 0;
      this.joystickVector.y = 0;
    } else {
      this.joystickVector.x = dx / dist;
      this.joystickVector.y = dy / dist;
    }
  }

  drawJoystickStick(offsetX, offsetY) {
    this.joystickStick.clear();
    this.joystickStick.fillStyle(0xffffff, 0.5);
    this.joystickStick.fillCircle(this.joystickCenter.x + offsetX, this.joystickCenter.y + offsetY, JOYSTICK_STICK_RADIUS);
  }

  updateFish(delta) {
    const dt = delta / 1000;
    for (const fish of this.fish) {
      if (fish.fishState !== 'swimming') continue; // caught fish ride the hook instead, see updateHook()
      fish.orbitAngle += fish.orbitDir * FISH_ANGULAR_SPEED * dt;
      fish.x = fish.orbitCenterX + Math.cos(fish.orbitAngle) * FISH_CIRCLE_RADIUS;
      fish.y = fish.orbitCenterY + Math.sin(fish.orbitAngle) * FISH_CIRCLE_RADIUS;
      // Tangent direction of travel around the circle, so the fish
      // faces the way it's swimming rather than the way it's facing outward.
      fish.rotation = fish.orbitAngle + fish.orbitDir * (Math.PI / 2);
    }
  }

  updateHook(delta) {
    if (this.hookState === 'idle') return;

    const dt = delta / 1000;
    const step = this.hookSpeed * dt;

    // Only look for a catch on the way out, and only until we've already
    // snagged one fish — one hook, one fish per cast.
    if (this.hookState === 'out' && !this.hookedFish) {
      for (const fish of this.fish) {
        if (fish.fishState !== 'swimming') continue;
        const fdx = fish.x - this.hook.x;
        const fdy = fish.y - this.hook.y;
        if (fdx * fdx + fdy * fdy <= FISH_CATCH_RADIUS * FISH_CATCH_RADIUS) {
          this.catchFish(fish);
          break;
        }
      }
    }

    // Same idea, but for other players' boats — one hit per cast, and
    // only while still heading out (mirrors the fish check above).
    // Position comes from each remote boat's last synced state, since
    // we don't need to ask them — we already have it.
    if (this.hookState === 'out' && !this.hookedFish) {
      for (const id in this.remoteBoats) {
        const remote = this.remoteBoats[id];
        if (!remote.data || remote.data.sunk) continue;
        const rdx = remote.sprite.x - this.hook.x;
        const rdy = remote.sprite.y - this.hook.y;
        if (rdx * rdx + rdy * rdy <= BOAT_HIT_RADIUS * BOAT_HIT_RADIUS) {
          this.hitOpponent(id, remote);
          break;
        }
      }
    }

    // The cast target is clamped to this.hookRange from the boat at the
    // moment of casting, but the boat keeps moving while the hook is
    // out — if it moves away from the target, the hook can end up
    // further than this.hookRange from the boat's *current* position, past
    // the edge of the range circle. Recheck every frame and turn the
    // hook back the instant that happens, rather than only at cast time.
    if (this.hookState === 'out') {
      const rdx = this.hook.x - this.boat.x;
      const rdy = this.hook.y - this.boat.y;
      if (rdx * rdx + rdy * rdy >= this.hookRange * this.hookRange) {
        this.hookState = 'returning';
      }
    }

    const target = this.hookState === 'out' ? this.hookTarget : this.boat;
    const dx = target.x - this.hook.x;
    const dy = target.y - this.hook.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist <= Math.max(step, HOOK_ARRIVE_DIST)) {
      if (this.hookState === 'out') {
        this.hook.setPosition(this.hookTarget.x, this.hookTarget.y);
        this.hookState = 'returning';
      } else {
        this.hookState = 'idle';
        this.hook.setVisible(false);
        if (this.hookedFish) {
          if (this.hookedFish.isShark) this.deliverShark();
          else this.deliverFish();
        }
      }
    } else {
      this.hook.x += (dx / dist) * step;
      this.hook.y += (dy / dist) * step;
    }

    if (this.hookedFish) this.hookedFish.setPosition(this.hook.x, this.hook.y);

    this.hookGraphics.clear();
    if (this.hookState !== 'idle') {
      this.hookGraphics.lineStyle(2, 0x3a2a1a, 0.8);
      this.hookGraphics.lineBetween(this.boat.x, this.boat.y, this.hook.x, this.hook.y);
    }
  }

  catchFish(fish) {
    // Catching short-circuits the outward cast — no need to keep
    // travelling to the original click point once a fish is on the hook.
    fish.fishState = 'caught';
    if (fish.isShark) {
      // Reveal what it actually was — swap from the plain fish look to
      // the much larger red shark sprite, same convention as a real
      // fish "coming above water" but with its own true texture rather
      // than a tint, since sharkTexture is already drawn in color.
      fish.clearTint();
      fish.setTexture('sharkTexture');
      fish.setAlpha(1);
    } else {
      fish.setTint(FISH_CAUGHT_TINT);
      fish.setAlpha(1);
    }
    this.hookedFish = fish;
    this.hookState = 'returning';
  }

  hitOpponent(id, remote) {
    // Nothing rides back on the hook for a boat hit (unlike a fish) —
    // it's a tag, not a catch — so just turn the hook around.
    this.hookState = 'returning';

    const available = remote.data.fishCount || 0;
    const stolen = Math.min(PLAYER_HIT_FISH_STEAL_MAX, available);
    this.fishCount += stolen;
    this.fishHudText.setText('Fish: ' + this.fishCount);

    // We only know the victim's fish count as of their last synced
    // update, so we tell them how many we're taking rather than taking
    // it directly — they apply it to their own authoritative state (see
    // handleIncomingHit()), clamped defensively in case it's changed
    // since.
    db.ref('hits/' + id).push({ fishStolen: stolen });
  }

  deliverFish() {
    this.hookedFish.destroy();
    this.fish = this.fish.filter((f) => f !== this.hookedFish);
    this.hookedFish = null;
    this.fishCount++;
    this.fishHudText.setText('Fish: ' + this.fishCount);
  }

  deliverShark() {
    this.hookedFish.destroy();
    this.fish = this.fish.filter((f) => f !== this.hookedFish);
    this.hookedFish = null;
    this.stunnedUntil = this.time.now + SHARK_STUN_MS;
    this.applyDamage(SHARK_DAMAGE_PERCENT);
  }

  spawnFish() {
    const fishCount = this.fish.filter((f) => !f.isShark).length;
    if (fishCount >= FISH_MAX) return;
    const fish = this.spawnSwimmer();
    fish.isShark = false;
  }

  spawnShark() {
    const sharkCount = this.fish.filter((f) => f.isShark).length;
    if (sharkCount >= SHARK_MAX) return;
    const shark = this.spawnSwimmer();
    shark.isShark = true;
  }

  // Shared setup for both fish and sharks — while swimming they're
  // visually and behaviorally identical (same texture, same circling
  // motion); only the isShark flag set by the caller distinguishes
  // them, read later when the hook catches one.
  spawnSwimmer() {
    const margin = FISH_CIRCLE_RADIUS + FISH_TEX_W / 2 + 4;
    const centerX = Phaser.Math.Between(WATER_LEFT + margin, WATER_RIGHT - margin);
    const centerY = Phaser.Math.Between(WATER_TOP + margin, WATER_BOTTOM - margin);

    const swimmer = this.add.image(centerX + FISH_CIRCLE_RADIUS, centerY, 'fishTexture');
    swimmer.setScale(WORLD_OBJECT_SCALE); // baked texture (fish or, once caught, shark) stays full-res
    swimmer.orbitCenterX = centerX;
    swimmer.orbitCenterY = centerY;
    swimmer.orbitAngle = Phaser.Math.FloatBetween(0, Math.PI * 2);
    swimmer.orbitDir = Phaser.Math.Between(0, 1) === 0 ? 1 : -1;
    swimmer.fishState = 'swimming';
    swimmer.setTint(FISH_SUBMERGED_TINT);
    swimmer.setAlpha(FISH_SUBMERGED_ALPHA);
    swimmer.setDepth(DEPTH_FISH);

    this.fish.push(swimmer);
    return swimmer;
  }

  createUpgradeButtons() {
    // Each entry is the whole definition of one upgrade — cost, icon,
    // when it's purchasable, and what buying it does. Adding another
    // upgrade later is just another entry here; the row lays itself
    // out and stays right-aligned regardless of how many there are.
    const defs = [
      {
        label: 'Repair',
        icon: 'iconRepairTexture',
        cost: UPGRADE_REPAIR_COST,
        isAvailable: () => this.boat.health < MAX_HEALTH,
        apply: () => { this.boat.health = MAX_HEALTH; }
      },
      {
        label: 'Boat Speed',
        icon: 'iconSpeedTexture',
        cost: UPGRADE_SPEED_COST,
        isAvailable: () => true,
        apply: () => { this.boatSpeed += UPGRADE_SPEED_INCREMENT; }
      },
      {
        label: 'Hook Range',
        icon: 'iconRangeTexture',
        cost: UPGRADE_RANGE_COST,
        isAvailable: () => true,
        apply: () => {
          this.hookRange += UPGRADE_RANGE_INCREMENT;
          this.updateRangeZoom(true); // ease the camera out so the bigger range circle stays on screen
        }
      },
      {
        label: 'Hook Speed',
        icon: 'iconHookSpeedTexture',
        cost: UPGRADE_HOOK_SPEED_COST,
        isAvailable: () => true,
        apply: () => { this.hookSpeed += UPGRADE_HOOK_SPEED_INCREMENT; }
      }
    ];

    const rowWidth = defs.length * UPGRADE_BUTTON_W + (defs.length - 1) * UPGRADE_BUTTON_GAP;
    const margin = Math.round(10 * UI_SCALE);
    const startX = WIDTH - margin - rowWidth;
    const y = margin;

    // Icon/cost vertical offsets within the button, tuned against the
    // original UPGRADE_BUTTON_H (68) — scaled the same way so they stay
    // proportional (not overflowing) as the button itself resizes. No
    // label row anymore (see def.label below) — that space goes to a
    // bit more breathing room around the icon instead.
    const iconOffsetY = Math.round(28 * TOUCH_UI_SCALE);
    const costOffsetY = Math.round(58 * TOUCH_UI_SCALE);
    const buttonFontSize = Math.round(10 * TOUCH_UI_SCALE) + 'px';

    this.upgradeButtons = [];

    defs.forEach((def, i) => {
      const x = startX + i * (UPGRADE_BUTTON_W + UPGRADE_BUTTON_GAP);

      // Fixed screen-space HUD (setScrollFactor(0)), not part of the
      // scrolling world — depth above default (0) just to keep it above
      // any other screen-fixed HUD it might overlap.
      const box = this.add.graphics().setDepth(DEPTH_TOUCH_UI).setScrollFactor(0);
      box.fillStyle(0x1a1a1a, 0.55);
      box.fillRoundedRect(x, y, UPGRADE_BUTTON_W, UPGRADE_BUTTON_H, 6);
      box.lineStyle(1, 0xffffff, 0.4);
      box.strokeRoundedRect(x, y, UPGRADE_BUTTON_W, UPGRADE_BUTTON_H, 6);

      // No text label (e.g. "Boat Speed") — the icon alone identifies the
      // upgrade, same info a player would otherwise get from hovering/
      // tapping, and dropping it frees the whole button for a bigger,
      // more legible icon on a small screen instead of three cramped rows.
      const icon = this.add.image(x + UPGRADE_BUTTON_W / 2, y + iconOffsetY, def.icon).setDepth(DEPTH_TOUCH_UI).setScrollFactor(0);

      const costText = this.add.text(x + UPGRADE_BUTTON_W / 2, y + costOffsetY, def.cost + ' fish', {
        fontFamily: 'sans-serif',
        fontSize: buttonFontSize,
