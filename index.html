        color: '#ffd873'
      }).setOrigin(0.5).setDepth(DEPTH_TOUCH_UI).setScrollFactor(0);

      const button = { def, box, icon, costText };

      // A Zone rather than making the graphics box itself interactive —
      // Graphics objects have no inherent size Phaser can hit-test, so
      // an invisible zone the size of the button is the simplest way to
      // give it a clickable area.
      const zone = this.add.zone(x + UPGRADE_BUTTON_W / 2, y + UPGRADE_BUTTON_H / 2, UPGRADE_BUTTON_W, UPGRADE_BUTTON_H).setScrollFactor(0);
      zone.setInteractive({ useHandCursor: true });
      zone.on('pointerdown', () => this.tryPurchase(button));

      this.upgradeButtons.push(button);
    });

    this.refreshUpgradeButtons();
  }

  refreshUpgradeButtons() {
    for (const button of this.upgradeButtons) {
      const affordable = !this.gameOver && button.def.isAvailable() && this.fishCount >= button.def.cost;
      const alpha = affordable ? 1 : 0.4;
      button.box.setAlpha(alpha);
      button.icon.setAlpha(alpha);
      button.costText.setAlpha(alpha);
    }
  }

  tryPurchase(button) {
    if (this.gameOver) return;
    const def = button.def;
    if (!def.isAvailable() || this.fishCount < def.cost) return;
    this.fishCount -= def.cost;
    this.fishHudText.setText('Fish: ' + this.fishCount);
    def.apply();
    this.refreshUpgradeButtons();
  }

  // Minimap — top-right, stacked below the upgrade-shop row (clear of
  // the touch joystick/hook button in the bottom corners). Hand-drawn
  // rather than a second Phaser camera: the scope is deliberately
  // minimal (world boundary + a dot per player, no fish/rocks/
  // driftwood), and a camera-based minimap would need an explicit
  // "ignore" list of every other game object to hit that same scope —
  // this just draws what's wanted directly, reusing the same "Graphics
  // cleared and redrawn every frame from live positions" pattern
  // already used for the health bar and hook-range circle.
  createMinimap() {
    const margin = Math.round(10 * UI_SCALE);
    const worldAspect = WORLD_HEIGHT / WORLD_WIDTH;
    const minimapW = Math.max(100, Math.round(150 * UI_SCALE));
    const minimapH = Math.round(minimapW * worldAspect);
    this.minimapX = WIDTH - margin - minimapW;
    this.minimapY = margin + UPGRADE_BUTTON_H + margin;
    this.minimapW = minimapW;
    this.minimapH = minimapH;

    // Static frame + background, drawn once — only the player dots
    // (see drawMinimap()) change from here on.
    this.add.graphics()
      .fillStyle(0x0b2033, 0.85)
      .fillRect(this.minimapX, this.minimapY, minimapW, minimapH)
      .lineStyle(2, 0xffffff, 0.6)
      .strokeRect(this.minimapX, this.minimapY, minimapW, minimapH)
      .setScrollFactor(0)
      .setDepth(DEPTH_TOUCH_UI);

    this.minimapDots = this.add.graphics().setScrollFactor(0).setDepth(DEPTH_TOUCH_UI + 1);
  }

  // Redrawn every frame (see update()) from live world positions — own
  // boat one color, every other non-sunk player's boat another, each
  // linearly scaled from world space into the minimap's screen rect.
  drawMinimap() {
    const g = this.minimapDots;
    g.clear();

    const toMinimap = (worldX, worldY) => ({
      x: this.minimapX + (worldX / WORLD_WIDTH) * this.minimapW,
      y: this.minimapY + (worldY / WORLD_HEIGHT) * this.minimapH
    });
    const dotRadius = Math.max(2, Math.round(3 * UI_SCALE));

    for (const id in this.remoteBoats) {
      const remote = this.remoteBoats[id];
      if (!remote.data || remote.data.sunk) continue;
      const p = toMinimap(remote.sprite.x, remote.sprite.y);
      g.fillStyle(0xff6b4a, 1);
      g.fillCircle(p.x, p.y, dotRadius);
    }

    // Drawn last so it's never hidden under an overlapping remote dot.
    if (!this.gameOver) {
      const p = toMinimap(this.boat.x, this.boat.y);
      g.fillStyle(0xffe066, 1);
      g.fillCircle(p.x, p.y, dotRadius + 1);
    }
  }

  drawHealthBar() {
    const pct = this.boat.health / MAX_HEALTH;
    const barX = this.boat.x - HEALTH_BAR_WIDTH / 2;
    const barY = this.boat.y + HEALTH_BAR_OFFSET_Y;

    this.healthBarGraphics.clear();

    // Background track
    this.healthBarGraphics.fillStyle(0x2b2b2b, 0.7);
    this.healthBarGraphics.fillRect(barX, barY, HEALTH_BAR_WIDTH, HEALTH_BAR_HEIGHT);

    // Fill — green when healthy, shifting to red as health drops
    const fillColor = pct > 0.5 ? 0x4caf50 : (pct > 0.25 ? 0xf0ad4e : 0xd9534f);
    this.healthBarGraphics.fillStyle(fillColor, 1);
    this.healthBarGraphics.fillRect(barX, barY, HEALTH_BAR_WIDTH * pct, HEALTH_BAR_HEIGHT);

    // Border
    this.healthBarGraphics.lineStyle(1, 0x111111, 0.9);
    this.healthBarGraphics.strokeRect(barX, barY, HEALTH_BAR_WIDTH, HEALTH_BAR_HEIGHT);
  }

  // A small repeating tile (see the TileSprite in create()) rather than
  // one image baked at the world's full size — WORLD_WIDTH x
  // WORLD_HEIGHT would be a raster texture tens of MB in size, a real
  // risk on lower-end mobile GPUs, for content (the ripple pattern) that
  // repeats anyway. Wave period matches the tile's own width exactly so
  // it lines up seamlessly at the left/right tiling seam.
  createWaterTileTexture() {
    const size = 128;
    const g = this.add.graphics();
    g.fillStyle(0x3a7bd5, 1);
    g.fillRect(0, 0, size, size);
    g.lineStyle(2, 0x5b9be0, 0.5);
    for (const rowY of [size * 0.25, size * 0.75]) {
      g.beginPath();
      g.moveTo(0, rowY);
      for (let x = 0; x <= size; x += 8) {
        g.lineTo(x, rowY + Math.sin((x / size) * Math.PI * 2) * 4);
      }
      g.strokePath();
    }
    g.generateTexture('waterTileTexture', size, size);
    g.destroy();
  }

  // The land ring (grass/trees/sand) framing the world's edges. Drawn
  // directly into the scene rather than baked with generateTexture()
  // like every other texture in this file — baking would need a texture
  // the full WORLD_WIDTH x WORLD_HEIGHT size (same memory problem as the
  // water above), and unlike the water's ripples this content isn't a
  // fine repeating pattern, just a modest number of shapes (a few
  // hundred grass patches/trees/sand speckles) around the perimeter, so
  // it's cheap enough to redraw as a live Graphics object. Built as four
  // explicit strips (top/bottom/left/right) rather than "fill everything
  // then let the water cover the middle" the way the old screen-sized
  // version did, since the water is a separate TileSprite now — filling
  // the interior here would just be wasted, invisible work.
  createBorderGraphics() {
    const g = this.add.graphics();
    const grassSide = BORDER - BEACH;

    const grassStrips = [
      [0, 0, WORLD_WIDTH, grassSide],                                   // top
      [0, WORLD_HEIGHT - grassSide, WORLD_WIDTH, grassSide],            // bottom
      [0, 0, grassSide, WORLD_HEIGHT],                                  // left
      [WORLD_WIDTH - grassSide, 0, grassSide, WORLD_HEIGHT]             // right
    ];
    g.fillStyle(0x4a7c3c, 1);
    for (const [x, y, w, h] of grassStrips) g.fillRect(x, y, w, h);

    // Subtle grass texture patches, scattered within each strip
    g.fillStyle(0x3f6b32, 1);
    for (const [x, y, w, h] of grassStrips) {
      for (let i = 0; i < 40; i++) {
        g.fillCircle(Phaser.Math.Between(x, x + w), Phaser.Math.Between(y, y + h), Phaser.Math.Between(3, 9));
      }
    }

    // Little pine trees lining the grass, set back from the beach.
    const treeSpacing = 28, treeStart = 15, treeNear = 10, treeFar = 24, treeHalfWidth = 7;
    g.fillStyle(0x2d5024, 1);
    for (let x = treeStart; x < WORLD_WIDTH; x += treeSpacing) {
      g.fillTriangle(x, grassSide - treeNear, x - treeHalfWidth, grassSide - treeFar, x + treeHalfWidth, grassSide - treeFar);
      g.fillTriangle(x, WORLD_HEIGHT - grassSide + treeNear, x - treeHalfWidth, WORLD_HEIGHT - grassSide + treeFar, x + treeHalfWidth, WORLD_HEIGHT - grassSide + treeFar);
    }
    for (let y = treeStart; y < WORLD_HEIGHT; y += treeSpacing) {
      g.fillTriangle(grassSide - treeNear, y, grassSide - treeFar, y - treeHalfWidth, grassSide - treeFar, y + treeHalfWidth);
      g.fillTriangle(WORLD_WIDTH - grassSide + treeNear, y, WORLD_WIDTH - grassSide + treeFar, y - treeHalfWidth, WORLD_WIDTH - grassSide + treeFar, y + treeHalfWidth);
    }

    // Sand beach ring, between the grass and the water
    const sandStrips = [
      [grassSide, grassSide, WORLD_WIDTH - grassSide * 2, BEACH],                                  // top
      [grassSide, WORLD_HEIGHT - grassSide - BEACH, WORLD_WIDTH - grassSide * 2, BEACH],           // bottom
      [grassSide, grassSide, BEACH, WORLD_HEIGHT - grassSide * 2],                                  // left
      [WORLD_WIDTH - grassSide - BEACH, grassSide, BEACH, WORLD_HEIGHT - grassSide * 2]             // right
    ];
    g.fillStyle(0xe0c284, 1);
    for (const [x, y, w, h] of sandStrips) g.fillRect(x, y, w, h);

    // A few darker sand speckles / pebbles for texture, confined to the beach ring
    g.fillStyle(0xc9a86a, 0.8);
    for (const [x, y, w, h] of sandStrips) {
      for (let i = 0; i < 60; i++) {
        g.fillCircle(Phaser.Math.Between(x, x + w), Phaser.Math.Between(y, y + h), Phaser.Math.Between(1, 3));
      }
    }
  }

  createCanoeTexture() {
    // Convention: at rotation 0, the sprite faces along +x (screen
    // right). So the bow (front) is drawn on the right side of the
    // texture, the stern (back) on the left. This must stay in sync
    // with how boat.rotation is set from velocity in update().
    const w = CANOE_TEX_W;
    const h = CANOE_TEX_H;
    const g = this.add.graphics();

    // Hull — asymmetric on purpose: the bow (right) tapers to a
    // sharper point, the stern (left) is blunter. Combined with the
    // fisherman facing the bow below (see the nose nub), this makes
    // "front" readable even at a glance.
    g.fillStyle(0x8b5a2b, 1);
    g.lineStyle(2, 0x5c3a1a, 1);
    g.beginPath();
    g.moveTo(6, h / 2);            // stern tip (blunter curve into it)
    g.lineTo(16, h / 2 - 9);
    g.lineTo(50, h / 2 - 9);
    g.lineTo(64, h / 2);           // bow tip (sharper — closer, tighter taper)
    g.lineTo(50, h / 2 + 9);
    g.lineTo(16, h / 2 + 9);
    g.closePath();
    g.fillPath();
    g.strokePath();

    // Darker interior "box" the fisherman sits inside
    g.fillStyle(0x6b4423, 1);
    g.fillEllipse(w / 2 - 2, h / 2, 46, 14);

    // --- Fisherman, seated inside the hull, facing the bow (+x) ---
    const seatX = 30; // slightly toward the stern, so the bow has some open deck

    // Torso — kept within the hull's vertical extent (h/2 ± 9)
    g.fillStyle(0xc0392b, 1);
    g.fillRoundedRect(seatX - 6, h / 2 - 6, 12, 12, 3);

    // Head, offset toward the bow from the torso to read as "facing forward"
    g.fillStyle(0xe0ac69, 1);
    g.fillCircle(seatX + 7, h / 2, 4.5);

    // Small nose/brim nub on the forward edge of the head — an
    // unambiguous "this is the front of the face" marker
    g.fillStyle(0xcf9a5c, 1);
    g.fillTriangle(
      seatX + 10, h / 2 - 2,
      seatX + 10, h / 2 + 2,
      seatX + 13, h / 2
    );

    g.generateTexture('canoeTexture', w, h);
    g.destroy();
  }

  createSunkTexture() {
    // Same canvas size and same seatX/fisherman coordinates as
    // createCanoeTexture(), so swapping textures on the sprite doesn't
    // cause any visual jump — only the hull disappears.
    const w = CANOE_TEX_W;
    const h = CANOE_TEX_H;
    const seatX = 30;
    const g = this.add.graphics();

    // Ripples where the boat used to be
    g.lineStyle(2, 0x5b9be0, 0.6);
    g.strokeCircle(seatX, h / 2, 13);
    g.strokeCircle(seatX, h / 2, 21);

    // The fisherman, floating without his boat
    g.fillStyle(0xc0392b, 1);
    g.fillRoundedRect(seatX - 6, h / 2 - 6, 12, 12, 3);

    g.fillStyle(0xe0ac69, 1);
    g.fillCircle(seatX + 7, h / 2, 4.5);

    g.fillStyle(0xcf9a5c, 1);
    g.fillTriangle(
      seatX + 10, h / 2 - 2,
      seatX + 10, h / 2 + 2,
      seatX + 13, h / 2
    );

    g.generateTexture('sunkTexture', w, h);
    g.destroy();
  }

  createFishTexture() {
    // Drawn in plain white/gray so setTint() gives predictable results:
    // a dark tint reads as a submerged shadow, a warm tint reads as a
    // fish that's just been pulled above the surface. Faces +x, same
    // convention as the canoe texture.
    const w = FISH_TEX_W;
    const h = FISH_TEX_H;
    const g = this.add.graphics();

    g.fillStyle(0xffffff, 1);
    g.fillEllipse(w * 0.58, h / 2, w * 0.72, h);
    g.fillTriangle(w * 0.3, h / 2, 0, h * 0.12, 0, h * 0.88);

    g.fillStyle(0xdddddd, 1);
    g.fillCircle(w * 0.8, h / 2, 1.6);

    g.generateTexture('fishTexture', w, h);
    g.destroy();
  }

  createSharkTexture() {
    // Only ever shown after a catch (while swimming, sharks use the
    // plain fishTexture like everything else) — so this can just be
    // drawn in its true red colors directly, no tint trickery needed.
    // Same +x-facing convention as the other sprites, just much bigger.
    const w = SHARK_TEX_W;
    const h = SHARK_TEX_H;
    const g = this.add.graphics();

    g.fillStyle(0xc62828, 1);
    g.lineStyle(2, 0x7a1313, 1);
    g.beginPath();
    g.moveTo(w * 0.05, h / 2);
    g.lineTo(w * 0.2, h * 0.28);
    g.lineTo(w * 0.62, h * 0.32);
    g.lineTo(w * 0.95, h / 2);   // pointed snout — the front
    g.lineTo(w * 0.62, h * 0.68);
    g.lineTo(w * 0.2, h * 0.72);
    g.closePath();
    g.fillPath();
    g.strokePath();

    // Dorsal fin
    g.fillStyle(0xa71f1f, 1);
    g.fillTriangle(w * 0.42, h * 0.28, w * 0.52, h * 0.02, w * 0.6, h * 0.3);

    // Tail fin, at the back (-x)
    g.fillTriangle(w * 0.08, h / 2, 0, h * 0.15, 0, h * 0.85);

    // Pale belly highlight for a bit of depth
    g.fillStyle(0xe57373, 0.7);
    g.fillEllipse(w * 0.5, h * 0.58, w * 0.4, h * 0.16);

    // Eye
    g.fillStyle(0x111111, 1);
    g.fillCircle(w * 0.78, h * 0.46, 1.8);

    g.generateTexture('sharkTexture', w, h);
    g.destroy();
  }

  createHookTexture() {
    const size = 14;
    const g = this.add.graphics();

    // Shaft plus a curled tip — a simple metal J-hook silhouette.
    g.lineStyle(2, 0x999999, 1);
    g.beginPath();
    g.moveTo(size / 2, 0);
    g.lineTo(size / 2, size - 6);
    g.arc(size / 2 - 3, size - 6, 3, 0, Math.PI * 1.4, false);
    g.strokePath();

    g.generateTexture('hookTexture', size, size);
    g.destroy();
  }

  createUpgradeIconTextures() {
    const s = UPGRADE_ICON_SIZE;

    // Repair — a plus/cross, in the same green the health bar uses when
    // healthy. Drawn as one closed polygon rather than two overlapping
    // rects so there's no visible seam where they'd cross.
    {
      const g = this.add.graphics();
      const t = s * 0.32; // arm thickness
      const lo = s / 2 - t / 2, hi = s / 2 + t / 2;
      g.fillStyle(0x4caf50, 1);
      g.beginPath();
      g.moveTo(lo, 0);
      g.lineTo(hi, 0);
      g.lineTo(hi, lo);
      g.lineTo(s, lo);
      g.lineTo(s, hi);
      g.lineTo(hi, hi);
      g.lineTo(hi, s);
      g.lineTo(lo, s);
      g.lineTo(lo, hi);
      g.lineTo(0, hi);
      g.lineTo(0, lo);
      g.lineTo(lo, lo);
      g.closePath();
      g.fillPath();
      g.generateTexture('iconRepairTexture', s, s);
      g.destroy();
    }

    // Boat speed — a bold forward chevron with a couple of motion
    // lines trailing it, like a wake.
    {
      const g = this.add.graphics();
      g.fillStyle(0xffffff, 1);
      g.fillTriangle(s * 0.35, s * 0.15, s * 0.35, s * 0.85, s * 0.78, s * 0.5);
      g.lineStyle(3, 0xffffff, 0.6);
      g.lineBetween(s * 0.04, s * 0.32, s * 0.24, s * 0.32);
      g.lineBetween(s * 0.04, s * 0.68, s * 0.24, s * 0.68);
      g.generateTexture('iconSpeedTexture', s, s);
      g.destroy();
    }

    // Hook range — a target/rings icon.
    {
      const g = this.add.graphics();
      g.lineStyle(2, 0xffffff, 1);
      g.strokeCircle(s / 2, s / 2, s * 0.42);
      g.strokeCircle(s / 2, s / 2, s * 0.24);
      g.fillStyle(0xffffff, 1);
      g.fillCircle(s / 2, s / 2, s * 0.07);
      g.generateTexture('iconRangeTexture', s, s);
      g.destroy();
    }

    // Hook speed — a lightning bolt.
    {
      const g = this.add.graphics();
      g.fillStyle(0xffe066, 1);
      g.beginPath();
      g.moveTo(s * 0.55, 0);
      g.lineTo(s * 0.15, s * 0.55);
      g.lineTo(s * 0.42, s * 0.55);
      g.lineTo(s * 0.35, s);
      g.lineTo(s * 0.85, s * 0.4);
      g.lineTo(s * 0.55, s * 0.4);
      g.closePath();
      g.fillPath();
      g.generateTexture('iconHookSpeedTexture', s, s);
      g.destroy();
    }
  }

  createRockTexture() {
    const size = ROCK_RADIUS * 2;
    const cx = ROCK_RADIUS;
    const cy = ROCK_RADIUS;
    const g = this.add.graphics();

    // Slightly irregular rock silhouette (a wobbled circle)
    g.fillStyle(0x8a8a8a, 1);
    g.lineStyle(2, 0x5f5f5f, 1);
    g.beginPath();
    const points = 10;
    for (let i = 0; i <= points; i++) {
      const angle = (i / points) * Math.PI * 2;
      const wobble = 1 + (i % 2 === 0 ? 0.08 : -0.06);
      const px = cx + Math.cos(angle) * ROCK_RADIUS * wobble;
      const py = cy + Math.sin(angle) * ROCK_RADIUS * wobble;
      if (i === 0) g.moveTo(px, py);
      else g.lineTo(px, py);
    }
    g.closePath();
    g.fillPath();
    g.strokePath();

    // A couple of darker shading patches for a bit of depth
    g.fillStyle(0x6f6f6f, 0.6);
    g.fillEllipse(cx - 5, cy + 4, 14, 9);
    g.fillStyle(0xa8a8a8, 0.6);
    g.fillEllipse(cx + 4, cy - 6, 10, 7);

    g.generateTexture('rockTexture', size, size);
    g.destroy();
  }

  // Drawn lying flat (long edge horizontal) — the vertical-moving
  // driftwood piece rotates the sprite 90° at creation instead of this
  // being drawn twice, see the DRIFTWOOD_CONFIGS loop in create().
  createDriftwoodTexture() {
    const w = DRIFTWOOD_LEN;
    const h = DRIFTWOOD_WIDTH;
    const g = this.add.graphics();

    g.fillStyle(0x6b4423, 1);
    g.lineStyle(1, 0x4a2e18, 1);
    g.fillRoundedRect(0, 0, w, h, h / 2); // capsule shape reads as a log's rounded tips
    g.strokeRoundedRect(0, 0, w, h, h / 2);

    // Rings near each end suggest cut log faces; a couple of grain
    // lines along the length for texture.
    g.lineStyle(1.5, 0x4a2e18, 0.7);
    g.strokeEllipse(h * 0.55, h / 2, h * 0.55, h * 0.85);
    g.strokeEllipse(w - h * 0.55, h / 2, h * 0.55, h * 0.85);
    g.lineStyle(1, 0x53311d, 0.5);
    g.lineBetween(h * 0.9, h * 0.3, w - h * 0.9, h * 0.3);
    g.lineBetween(h * 0.9, h * 0.7, w - h * 0.9, h * 0.7);

    g.generateTexture('driftwoodTexture', w, h);
    g.destroy();
  }
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  backgroundColor: '#3a7bd5',
  width: WIDTH,
  height: HEIGHT,
  input: {
    activePointers: 3 // joystick + hook button need to work as simultaneous touches
  },
  physics: {
    default: 'matter',
    matter: {
      gravity: { x: 0, y: 0 },
      debug: false
    }
  },
  scene: [TitleScene, MainScene]
};

new Phaser.Game(config);
</script>
